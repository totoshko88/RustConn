[package]
name = "rustconn-core"
description = "Core library for RustConn connection manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

# cargo-machete scans the source textually for the dependency's name, so a crate
# whose import path differs from its package name always looks unused. These are
# verified in use; the CI `machete` job would otherwise fail on every run.
[package.metadata.cargo-machete]
ignored = [
    # package md-5    -> `use md5::{Digest, Md5}` in connection/spa.rs
    "md-5",
    # package vnc-rs  -> `use vnc::{...}` in vnc_client/client.rs (vnc-embedded)
    "vnc-rs",
    # Not imported at all, and deliberately so: declared to pin the version away
    # from native-tls 0.2.17's Tlsv13 compile bug and to select the native-tls
    # backend for the ironrdp-tls / ironrdp-mstsgu features.
    "native-tls",
]

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
dirs = { workspace = true }
shellexpand = { workspace = true }
regex = { workspace = true }
ring = { workspace = true }
hex = { workspace = true }
data-encoding = "2.10"
# fwknop SPA packet builder (AES-256-CBC + EVP_BytesToKey)
aes = "0.9"
cbc = { version = "0.2", features = ["block-padding"] }
md-5 = "0.11"
csv = "1"
glob = "0.3"
shell-words = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
argon2 = { workspace = true }
hostname = "0.4"
slug = "0.1"
unicode-segmentation = { workspace = true }
# HTTP client and archive handling (for CLI download in Flatpak)
reqwest = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# For extracting .deb packages (AWS SSM Plugin)
# Comment kept on its own line: a trailing comment after a bare version string
# is not parsed by manifest scanners (KiroGraph sec:cargo), which then skips the dep.
ar = "0.9"
# File system notifications for RDPDR directory change monitoring
# Linux-only application, no macOS features needed
# macos_fsevent is needed for macOS dev builds (fsevent_sys dependency)
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# Tracing for structured logging and performance profiling.
# NOTE: only `tracing` belongs here. `tracing-subscriber` was a direct dependency
# of this crate until 2026-08-12 without a single reference in its source — the
# subscriber is installed by the application entry points (rustconn/src/main.rs,
# rustconn-cli/src/main.rs), which declare and use it themselves, and this
# crate's own tracing/mod.rs doc comment already said so. Found by cargo-machete
# when it was first wired into CI. Do not re-add it: a library that pulls in a
# subscriber invites two subscribers in one process.
tracing = { workspace = true }
# Pure Rust VNC client for embedded VNC sessions
vnc-rs = { version = "0.5", optional = true }
# JPEG decoder for VNC Tight encoding (pure Rust, no C deps). Already present
# transitively; re-exports zune_core so no second direct dependency is needed.
zune-jpeg = { version = "0.5.15", optional = true }
# Pure Rust RDP client for embedded RDP sessions using IronRDP (crates.io)
# native-tls instead of rustls to match rdw approach
# Features: cliprdr (clipboard), rdpdr (shared folders + printer), dvc (dynamic channels),
# displaycontrol (dynamic resolution), rdpsnd (audio), echo (RTT measurement)
#
# ON UPGRADE (0.17 → next) — re-check whether these are now usable upstream:
#   * RAIL / RemoteApp (MS-RDPERP): only opaque CapabilitySet::Rail buffer exists,
#     no channel/handshake → RemoteApp still forces external xfreerdp3 fallback.
#   * GFX pipeline + H.264/AVC420 (MS-RDPEGFX): ✅ DONE — integrated via
#     ironrdp-egfx 0.3 + gfx-h264 feature (AVC420 decode, OpenH264 dlopen).
#   * GFX + AVC444: ❌ NOT usable. ironrdp-egfx 0.3.0 client.rs matches
#     Codec1Type::Avc444 / Avc444v2 and forwards them to on_unhandled_pdu with
#     "AVC444 codec not yet implemented" instead of decoding. Because Windows
#     picks the client's best offer, advertising AVC444 froze whole sessions
#     (issue #262). rdp_client::gfx_handler::RustConnGfxHandler::capabilities()
#     therefore advertises V8_1(AVC420)+V8 only, never V10.x. When AVC444 lands
#     upstream, re-add CapabilitySet::V10_7 there — the test
#     `advertised_capabilities_exclude_avc444` marks the spot.
#   * Audio input / microphone (MS-RDPEAI): no channel → microphone_enabled field
#     in RdpClientConfig is still dead (unrelated to GFX work; needs upstream support).
#   * Drive change notifications: needs ClientDriveNotifyChangeDirectoryResponse
#     PDU. Confirmed absent in ironrdp-rdpdr 0.7 (the version paired with ironrdp
#     0.17): only the server-side request and ClientDriveQueryDirectoryResponse
#     exist. inotify detection works; the response cannot be sent until upstream
#     adds the type.
# Features (kept on one line so manifest scanners can parse the dependency):
#   cliprdr        — clipboard redirection
#   rdpdr          — device/drive redirection (shared folders)
#   dvc            — dynamic virtual channels
#   displaycontrol — dynamic resolution changes (MS-RDPEDISP)
#   rdpsnd         — audio redirection
#   echo           — echo DVC for RTT measurement (MS-RDPEECO)
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "pdu", "core", "svc", "cliprdr", "rdpdr", "dvc", "displaycontrol", "rdpsnd", "echo"], optional = true }
ironrdp-input = { version = "0.7", optional = true }
ironrdp-tokio = { version = "0.10", features = ["reqwest"], optional = true }
ironrdp-tls = { version = "0.2", features = ["native-tls"], optional = true }
# GFX pipeline (MS-RDPEGFX) with H.264/AVC decoding via OpenH264 dlopen
ironrdp-egfx = { version = "0.3", features = ["openh264-libloading"], optional = true }
# RD Gateway (MS-TSGU) — HTTPS tunneling for RDP through corporate gateways
ironrdp-mstsgu = { version = "0.0.1", features = ["native-tls"], optional = true }
# Pin native-tls to avoid Tlsv13 compile bug in 0.2.17
native-tls = { workspace = true, optional = true }
nix = { version = "0.31.2", features = ["fs", "signal", "process"] }
# MPTCP (Multipath TCP) socket creation — safe API, no unsafe needed
socket2 = { version = "0.6", features = ["all"] }
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.3", optional = true }

# Secret Service (keyring) client. Gated to non-macOS so oo7 NEVER compiles on
# macOS (which uses security-framework above). Used by the LibSecret/keyring
# path in Part C.
[target.'cfg(not(target_os = "macos"))'.dependencies]
oo7 = { workspace = true, optional = true }

# Note: ironrdp-rdpdr-native 0.7 requires ironrdp-rdpdr 0.7.x which matches ironrdp 0.17

[features]
default = []
# Domain-only builds should keep this crate usable without desktop/session
# integration dependencies. Enable the following features only in crates that
# embed clients or integrate with the host desktop keyring.
system-keyring = ["dep:oo7", "dep:security-framework"]
vnc-embedded = ["dep:vnc-rs", "dep:zune-jpeg"]
# web-embedded enables the embedded WebKitGTK 6.0 WebView for in-tab web browsing
web-embedded = []
# rdp-embedded feature enables the RdpClient struct with IronRDP
rdp-embedded = [
    "dep:ironrdp",
    "dep:ironrdp-input",
    "dep:ironrdp-tokio",
    "dep:ironrdp-tls",
    "dep:native-tls",
]
# gfx-h264 enables EGFX pipeline with H.264/AVC decoding (requires rdp-embedded)
gfx-h264 = ["dep:ironrdp-egfx", "rdp-embedded"]
# rd-gateway enables native RD Gateway (MS-TSGU) tunneling without external client
rd-gateway = ["dep:ironrdp-mstsgu", "rdp-embedded"]

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "search_bench"
harness = false

[lints]
workspace = true
