[package]
name = "rustconn-core"
description = "Core library for RustConn connection manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

# cargo-machete scans the source textually for the dependency's name, so a crate
# whose import path differs from its package name always looks unused. These are
# verified in use; the CI `machete` job would otherwise fail on every run.
[package.metadata.cargo-machete]
ignored = [
    # package md-5    -> `use md5::{Digest, Md5}` in connection/spa.rs
    "md-5",
    # package vnc-rs  -> `use vnc::{...}` in vnc_client/client.rs (vnc-embedded)
    "vnc-rs",
    # Not imported at all, and deliberately so: declared to pin the version away
    # from native-tls 0.2.17's Tlsv13 compile bug and to select the native-tls
    # backend for the ironrdp-tls / ironrdp-mstsgu features.
    "native-tls",
]

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
dirs = { workspace = true }
shellexpand = { workspace = true }
regex = { workspace = true }
ring = { workspace = true }
hex = { workspace = true }
data-encoding = "2.10"
# fwknop SPA packet builder (AES-256-CBC + EVP_BytesToKey)
aes = "0.9"
cbc = { version = "0.2", features = ["block-padding"] }
md-5 = "0.11"
csv = "1"
glob = "0.3"
shell-words = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
argon2 = { workspace = true }
hostname = "0.4"
slug = "0.1"
unicode-segmentation = { workspace = true }
# HTTP client and archive handling (for CLI download in Flatpak)
reqwest = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# bzip2 decompression for the on-demand Cisco OpenH264 blob
# (rdp_client::openh264_download). Already present transitively via `zip`
# (bzip2 0.6.1); declared as a direct workspace dependency so the module can
# name it. The default feature uses the pure-Rust `libbz2-rs-sys` backend, so
# this adds NO C/system dependency and no new crate to the build graph.
bzip2 = { workspace = true }
# For extracting .deb packages (AWS SSM Plugin)
# Comment kept on its own line: a trailing comment after a bare version string
# is not parsed by manifest scanners (KiroGraph sec:cargo), which then skips the dep.
ar = "0.9"
# File system notifications for RDPDR directory change monitoring
# Linux-only application, no macOS features needed
# macos_fsevent is needed for macOS dev builds (fsevent_sys dependency)
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# Tracing for structured logging and performance profiling.
# NOTE: only `tracing` belongs here. `tracing-subscriber` was a direct dependency
# of this crate until 2026-08-12 without a single reference in its source — the
# subscriber is installed by the application entry points (rustconn/src/main.rs,
# rustconn-cli/src/main.rs), which declare and use it themselves, and this
# crate's own tracing/mod.rs doc comment already said so. Found by cargo-machete
# when it was first wired into CI. Do not re-add it: a library that pulls in a
# subscriber invites two subscribers in one process.
tracing = { workspace = true }
# Pure Rust VNC client for embedded VNC sessions
vnc-rs = { version = "0.6", optional = true }
# JPEG decoder for VNC Tight encoding (pure Rust, no C deps). Already present
# transitively; re-exports zune_core so no second direct dependency is needed.
zune-jpeg = { version = "0.5.15", optional = true }
# Pure Rust RDP client for embedded RDP sessions using IronRDP (crates.io)
# native-tls instead of rustls to match rdw approach.
#
# Depended on crate by crate since the 2026-10-27/28 releases: the `ironrdp`
# meta crate is still 0.17 and pins the July stack (connector 0.10, dvc 0.8),
# which has no graphics-pipeline flag in the early capabilities, no AVC444 and
# no audio input. Keep the whole set on one release train — every crate below
# shares ironrdp-core 0.3 / ironrdp-pdu 0.11 / ironrdp-dvc 0.10.
#
# ON UPGRADE — re-check whether these are now usable upstream:
#   * RAIL / RemoteApp (MS-RDPERP): RemoteApp still forces the external
#     xfreerdp3 fallback.
#   * Drive change notifications: needs ClientDriveNotifyChangeDirectoryResponse
#     in ironrdp-rdpdr; inotify detection works, the response cannot be sent.
ironrdp-connector = { version = "0.12", optional = true }
ironrdp-session = { version = "0.13", optional = true }
ironrdp-graphics = { version = "0.11", optional = true }
ironrdp-pdu = { version = "0.11", optional = true }
ironrdp-core = { version = "0.3", optional = true }
ironrdp-svc = { version = "0.10", optional = true }
# clipboard redirection
ironrdp-cliprdr = { version = "0.9", optional = true }
# device/drive redirection (shared folders, printers)
ironrdp-rdpdr = { version = "0.9", optional = true }
# dynamic virtual channels
ironrdp-dvc = { version = "0.10", optional = true }
# dynamic resolution changes (MS-RDPEDISP)
ironrdp-displaycontrol = { version = "0.10", optional = true }
# audio output (MS-RDPEA)
ironrdp-rdpsnd = { version = "0.11", optional = true }
# microphone (MS-RDPEAI, AUDIO_INPUT channel)
ironrdp-rdpeai = { version = "0.2", optional = true }
# echo DVC for RTT measurement (MS-RDPEECO)
ironrdp-echo = { version = "0.6", optional = true }
ironrdp-input = { version = "0.9", optional = true }
ironrdp-tokio = { version = "0.12", features = ["reqwest-native-tls"], optional = true }
ironrdp-tls = { version = "0.3", features = ["native-tls"], optional = true }
# `ironrdp_tls::upgrade` returns the server certificate as an `x509_cert::Certificate`;
# we re-encode it to DER to compute the TOFU fingerprint. Same version already in the
# tree via ironrdp-tls, kept as a direct dep so the type is nameable here.
x509-cert = { version = "0.3", optional = true }
# GFX pipeline (MS-RDPEGFX) with H.264/AVC420 and AVC444 decoding via OpenH264 dlopen
ironrdp-egfx = { version = "0.5", features = ["openh264-libloading"], optional = true }
# RD Gateway (MS-TSGU) — HTTPS tunneling for RDP through corporate gateways
ironrdp-mstsgu = { version = "0.1", features = ["native-tls"], optional = true }
# Pin native-tls to avoid Tlsv13 compile bug in 0.2.17
native-tls = { workspace = true, optional = true }
nix = { version = "0.31.2", features = ["fs", "signal", "process"] }
# MPTCP (Multipath TCP) socket creation — safe API, no unsafe needed
socket2 = { version = "0.6", features = ["all"] }
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.3", optional = true }

# Secret Service (keyring) client. Gated to non-macOS so oo7 NEVER compiles on
# macOS (which uses security-framework above). Used by the LibSecret/keyring
# path in Part C.
[target.'cfg(not(target_os = "macos"))'.dependencies]
oo7 = { workspace = true, optional = true }

[features]
default = []
# Domain-only builds should keep this crate usable without desktop/session
# integration dependencies. Enable the following features only in crates that
# embed clients or integrate with the host desktop keyring.
system-keyring = ["dep:oo7", "dep:security-framework"]
vnc-embedded = ["dep:vnc-rs", "dep:zune-jpeg"]
# web-embedded enables the embedded WebKitGTK 6.0 WebView for in-tab web browsing
web-embedded = []
# rdp-embedded feature enables the RdpClient struct with IronRDP
rdp-embedded = [
    "dep:ironrdp-connector",
    "dep:ironrdp-session",
    "dep:ironrdp-graphics",
    "dep:ironrdp-pdu",
    "dep:ironrdp-core",
    "dep:ironrdp-svc",
    "dep:ironrdp-cliprdr",
    "dep:ironrdp-rdpdr",
    "dep:ironrdp-dvc",
    "dep:ironrdp-displaycontrol",
    "dep:ironrdp-rdpsnd",
    "dep:ironrdp-rdpeai",
    "dep:ironrdp-echo",
    "dep:ironrdp-input",
    "dep:ironrdp-tokio",
    "dep:ironrdp-tls",
    "dep:native-tls",
    "dep:x509-cert",
]
# gfx-h264 enables EGFX pipeline with H.264/AVC decoding (requires rdp-embedded)
gfx-h264 = ["dep:ironrdp-egfx", "rdp-embedded"]
# rd-gateway enables native RD Gateway (MS-TSGU) tunneling without external client
rd-gateway = ["dep:ironrdp-mstsgu", "rdp-embedded"]

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "search_bench"
harness = false

[lints]
workspace = true
