[package]
name = "rustconn"
description = "Manage remote connections easily"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

# Package name is gettext-rs, import path is `gettextrs`, so cargo-machete's
# textual scan cannot see it. Used across the GUI (i18n.rs, app.rs, tray.rs, …).
[package.metadata.cargo-machete]
ignored = ["gettext-rs"]

[[bin]]
name = "rustconn"
path = "src/main.rs"

[dependencies]
rustconn-core = { path = "../rustconn-core", version = "0.21.8", default-features = false }
tokio = { workspace = true }
# Event-driven tray message delivery to the GTK main loop (no polling)
async-channel = { workspace = true }
gtk4 = { workspace = true, features = ["v4_14"] }
libadwaita = { workspace = true }
gdk4-wayland = { version = "0.11", optional = true }
vte4 = { workspace = true, features = ["v0_76"] }
uuid = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
open = "5"
dirs = { workspace = true }
# Tray icon support via StatusNotifierItem D-Bus protocol
# Requires libdbus-1-dev on Ubuntu/Debian or dbus-devel on Fedora
ksni = { version = "0.3", features = ["blocking"], optional = true }
# SVG rendering for tray icon (renders SVG to ARGB32 pixmap)
resvg = { version = "0.48", optional = true }
# macOS tray icon via NSStatusItem (cross-platform crate, used only on macOS)
#
# `default-features = false` on both, and it is not a micro-optimisation. The
# default feature of each is `["libxdo", "gtk"]`, and `tray-icon`'s `gtk` feature
# is `["muda/gtk", "dep:libappindicator"]` — so accepting the defaults put
# libappindicator, gtk 0.18 and with it atk, gdk, gtk-sys, gtk3-macros, glib 0.18
# and libxdo into `Cargo.lock`. Those are the gtk3 bindings, and they account for
# several of the allow-listed advisories in `.cargo/audit.toml` and `deny.toml`,
# RUSTSEC-2024-0429 (glib unsoundness) and RUSTSEC-2024-0419 (gtk3 bindings
# unmaintained) among them.
#
# The dependencies themselves are already `[target.'cfg(linux/BSD)']` inside those
# crates, so none of it was ever *compiled* — but `cargo audit` and `cargo deny`
# read `Cargo.lock`, which is target-agnostic, so the advisories were reported for
# every platform regardless. Target-gating these two deps here would therefore
# have changed nothing; turning the feature off is what removes them from the
# graph. On macOS, where these crates are actually used, the disabled features
# contribute nothing: the tray goes through objc2 and AppKit.
tray-icon = { version = "0.24", optional = true, default-features = false }
# Menu builder for macOS tray (companion to tray-icon)
muda = { version = "0.19", optional = true, default-features = false }
# Internationalization (gettext). Only the safe part of the API is used here —
# `bindtextdomain`, `textdomain`, `gettext`, `ngettext`. `setlocale` is `unsafe`
# as of 0.8 (RUSTSEC-2026-0244) and `unsafe_code` is forbidden in this crate, so
# it is reached through rustconn-locale-sys below.
gettext-rs = { workspace = true }
# Tracing for structured logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Audio playback for RDP embedded mode
cpal = { version = "0.18", optional = true }
serde = { workspace = true, features = ["derive"] }
shell-words = "1"
nix = { version = "0.31", features = ["signal", "process"] }
# PTY creation, sizing and controlling-terminal setup for every session's
# child. Lives in its own crate because `unsafe` is forbidden here.
rustconn-pty-sys = { path = "../rustconn-pty-sys", version = "0.21.8" }
# The startup `setlocale` call, guarded so it can only run from the startup
# thread, before this program has spawned any thread of its own, and before the
# window is sealed. Same reason for the separate crate: `setlocale` is `unsafe`
# in gettext-rs 0.8 and `unsafe` is forbidden here.
rustconn-locale-sys = { path = "../rustconn-locale-sys", version = "0.21.8" }
# The startup `GSK_RENDERER` and `LANGUAGE` writes, guarded the same way.
# Neither GTK nor gettext offers an API for these, so the environment is the only
# interface, and `std::env::set_var` is `unsafe` in edition 2024 while `unsafe`
# is forbidden here. Not gated to one platform on purpose: the X11 (#85), macOS
# guest-VM (#274) and Flatpak language (#158) paths all go through it, and an
# unconditional dependency is what gets the guard compiled and its contract
# tests run on every job rather than on the one macOS job alone.
rustconn-env-sys = { path = "../rustconn-env-sys", version = "0.21.8" }
# The macOS Dock tile image, for launches LaunchServices cannot find an icon for
# (a bare binary from a shell, or an .app whose CFBundleExecutable execs a binary
# outside the bundle). `-[NSApplication setApplicationIconImage:]` is the only
# interface that works there, GDK exposes no Dock API, and `unsafe` is forbidden
# here. Unconditional for the same reason as the three above; the AppKit bindings
# it needs are target-gated inside that crate, since they build nowhere else.
rustconn-dock-sys = { path = "../rustconn-dock-sys", version = "0.21.8" }
# WebKitGTK 6.0 bindings for embedded web browser (Linux only)
webkit6 = { version = "0.6", optional = true }

[features]
# SPICE sessions always use an external viewer (virt-viewer/remote-viewer).
# The native embedded SPICE path was removed in 0.18.0: spice-client 0.2 exposes
# neither an inputs channel nor raw display frames, so embedding was impossible
# without forking the crate.
default = [
    "tray",
    "system-keyring",
    "vnc-embedded",
    "rdp-embedded",
    "gfx-h264",
    "rdp-audio",
    "rd-gateway",
    "wayland-native",
    "web-embedded",
]
tray = ["dep:ksni", "dep:resvg"]
tray-macos = ["dep:tray-icon", "dep:muda", "dep:resvg"]
system-keyring = ["rustconn-core/system-keyring"]
vnc-embedded = ["rustconn-core/vnc-embedded"]
rdp-embedded = ["rustconn-core/rdp-embedded"]
gfx-h264 = ["rustconn-core/gfx-h264"]
rd-gateway = ["rustconn-core/rd-gateway"]
rdp-audio = ["rdp-embedded", "dep:cpal"]
wayland-native = ["dep:gdk4-wayland"]
# Embedded WebKitGTK 6.0 web browser for in-tab Web protocol connections (Linux only)
web-embedded = ["dep:webkit6", "rustconn-core/web-embedded"]
# Enable libadwaita 1.6+ widgets (AdwSpinner, CSS variables, accent colors)
# Requires libadwaita >= 1.6 at build time (GNOME 50 Flatpak runtime or Fedora 44+).
# NOT in `default`, and NOT retirable in 0.21.0 — checked, because the
# "retire it once no supported target is below 1.6" note below invites the
# question every release. The binding constraint is **Ubuntu 24.04 LTS**, which
# ships libadwaita 1.5.0 and is listed as the baseline tier in
# packaging/obs/README.md. Its standard support runs to 2029. The snap's core24
# gnome platform is the same story and is often cited as the only reason, which
# makes a core26 GNOME extension look like the thing to wait for; it is not, and
# checking it answers nothing while 24.04 is still a target.
# NOT in `default`: Ubuntu 24.04 ships libadwaita 1.5.0 and the snap's core24
# gnome-46-2404 platform ships 1.5, so the default build must stay on the v1_5
# baseline. `crate::spinner` holds the single cfg that picks AdwSpinner over
# GtkSpinner; retire this feature once no supported target is below 1.6.
adw-1-6 = ["libadwaita/v1_6"]
# Enable libadwaita 1.7+ widgets (AdwWrapBox, AdwToggleGroup)
# Requires libadwaita >= 1.7 at build time (GNOME 48+ / Fedora 42+)
adw-1-7 = ["adw-1-6", "libadwaita/v1_7"]
# Enable libadwaita 1.8+ widgets (AdwShortcutsDialog, AdwShortcutLabel)
# Requires libadwaita >= 1.8 at build time (GNOME 49+ Flatpak runtime or Fedora 42+)
adw-1-8 = ["adw-1-7", "libadwaita/v1_8"]

# GTK4 baselines above the `v4_14` floor the workspace pins.
#
# What these do and do not buy, because it is easy to expect too much: the runtime
# behaviour of a newer GTK — portals for file dialogs by default (4.18), the
# accessibility work on entries and file choosers (4.20), GtkSvg (4.22) — arrives
# with the *linked* library and needs no feature at all. What the feature adds is
# access to API introduced in that version, and deprecation warnings for what it
# retired. The second half is the immediate value: it is what surfaced the three
# deprecations fixed alongside this.
#
# GNOME 50 is the target platform, so 4.22 is included rather than left for later.
# Every channel except the three on the `v4_14` floor — Ubuntu 24.04 deb, the snap's
# core24 platform and the noble AppImage — already runs 4.18 or newer.
gtk-4-18 = ["gtk4/v4_18"]
gtk-4-20 = ["gtk-4-18", "gtk4/v4_20"]
gtk-4-22 = ["gtk-4-20", "gtk4/v4_22"]

# Deliberately absent: an `adw-1-9` feature. libadwaita 1.9 is what GNOME 50 ships
# and RustConn already links against it there, but a cargo feature only widens the
# *bindings*, and nothing in this crate calls 1.9 API. Its automatic gains — the
# reduced-motion support and the accessibility fixes to badges and context menus —
# come from the linked library and are already in effect. `AdwSidebar` is the one
# widget worth the feature, and it does not fit: this sidebar is a `TreeListModel`
# with drag-and-drop and multi-selection, `AdwSidebar` is a flat list with sections.
# Add the feature when something needs it, not to record a version.

# VTE 0.78+ termprops: the `termprop-changed` signal and the scalar termprop
# getters. Used for shell integration (OSC 133) — `vte.shell.postexec` carries the
# exit code of the command that just finished, which drives the Command monitoring
# mode. See `crate::terminal::termprops`.
#
# NOT in `default`, and the reason is a build requirement rather than taste: three
# channels ship VTE 0.76 — Ubuntu 24.04 deb, the snap's core24 platform, and the
# noble-based AppImage. `system-deps` fails inside the build script rather than in
# the dependency solver when the installed VTE is older, which is a much less
# obvious error than a resolver conflict, so keep this opt-in per channel exactly
# as `adw-1-8` is. `debian.rules` detects the version with pkg-config.
#
# `MonitorMode::Command` exists in `rustconn-core` unconditionally, because that
# crate has no VTE dependency and `settings.toml` has to stay loadable across
# builds: a config written by the Flatpak must not break the snap. Without this
# feature the mode is hidden from the picker and never fires.
vte-0-78 = ["vte4/v0_78"]
# 0.80 adds image termprops, which `vte4` 0.10 does not bind and VTE 0.84 never
# populates ("this termprop is always unset"). Present for completeness only.
vte-0-80 = ["vte-0-78", "vte4/v0_80"]
# 0.82 lets the generic termprop OSC set the progress termprops; before it, only
# OSC 9;4 (ConEmu) could. Not required for reading them.
vte-0-82 = ["vte-0-80", "vte4/v0_82"]
vte-0-84 = ["vte-0-82", "vte4/v0_84"]

# Inherit workspace lints as base, then add GTK-specific suppressions.
# Note: Cargo requires that workspace = true stands alone in [lints];
# crate-specific overrides go into [lints.rust] / [lints.clippy] without
# repeating workspace = true — so we spell out the full lint set here.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_const_for_fn = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
option_if_let_else = "allow"
must_use_candidate = "allow"
match_same_arms = "allow"
uninlined_format_args = "allow"
manual_let_else = "allow"
no_effect_underscore_binding = "allow"
cloned_instead_of_copied = "allow"
unnecessary_wraps = "allow"
branches_sharing_code = "allow"
map_unwrap_or = "allow"
manual_map = "allow"
assigning_clones = "allow"
# GTK-specific clippy suppressions — scoped to the GUI crate only,
# so rustconn-core stays under stricter linting.
redundant_clone = "allow"
needless_borrow = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
wildcard_imports = "allow"
needless_borrows_for_generic_args = "allow"
redundant_closure_for_method_calls = "allow"
redundant_closure = "allow"
# redundant_pub_crate conflicts with the workspace's `unreachable_pub = "warn"`:
# it counts a `pub(crate) mod` as private, so it flags `pub(crate)` items that are
# genuinely reached from another subtree (dialogs::connection::automation_tab is
# used by window::edit_group) and suggests `pub`, which unreachable_pub then
# rejects. Mirrors the same allow in [workspace.lints.clippy].
redundant_pub_crate = "allow"

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }


