<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Monochrome macOS menu-bar variant of the RustConn icon.
  Drawn in solid black on a transparent background: the tray is registered as
  an NSImage *template*, so AppKit uses only the alpha channel and tints the
  glyph itself (dark on a light menu bar, white on a dark one, dimmed when the
  display is inactive). Colour here would be discarded, so none is used.
  Gear ring + viburnum branch with berries, matching the full-colour icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 32 32" width="32" height="32">
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- gear teeth: a dashed outer ring -->
    <circle cx="16" cy="16" r="14" stroke-width="3" stroke-linecap="butt" stroke-dasharray="3.67 3.67"/>
    <!-- gear body -->
    <circle cx="16" cy="16" r="12" stroke-width="2.2"/>
    <!-- branch -->
    <path d="M9.5 22.5 C12 19 14 16.5 18.5 12.5" stroke-width="1.8"/>
    <path d="M13.2 18.2 L10.8 15.8 M16 15 L16.2 11.6" stroke-width="1.6"/>
  </g>
  <g fill="#000000" stroke="none">
    <!-- berries -->
    <circle cx="10" cy="14.6" r="2"/>
    <circle cx="16.4" cy="10.2" r="2"/>
    <circle cx="21" cy="12" r="2.1"/>
    <circle cx="19.6" cy="17" r="2"/>
    <!-- leaf -->
    <path d="M9.8 22.8 C8.6 20.6 10 19 12.4 19.4 C12.8 21.4 11.8 22.8 9.8 22.8 Z"/>
  </g>
</svg>
