# cargo-deny configuration for RustConn
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# cargo-deny v2: vulnerability/unsound/notice fields removed (always error).
# Use `ignore` to suppress specific advisories.
unmaintained = "workspace"
yanked = "warn"
# Transitive dependency advisories with no available fix:
# - RUSTSEC-2023-0071: rsa 0.10.0-rc.18 Marvin Attack (medium 5.9). The fix
#   exists — rsa 0.10.0 (2026-11-08, constant-time crypto-bigint) is listed as
#   patched — but we cannot take it: ironrdp-connector 0.12.0 (latest) pins
#   picky =7.0.0-rc.26, and picky, sspi 0.23 and winscard 0.4 all pin
#   rsa =0.10.0-rc.18 (picky rc.29 still does). Not exploitable in our
#   local-client context: no RSA decryption oracle is exposed.
#   Upgrade path: picky/sspi/winscard move to rsa 0.10.0 and ironrdp-connector
#   follows; then drop this ignore.
#   Mirrored in .cargo/audit.toml so cargo-audit and cargo-deny agree.
# Last reviewed: 2026-11-09
# Next review: when picky, sspi or ironrdp-connector publishes a new version.
#
# RUSTSEC-2026-0244 (gettext-rs `setlocale` unsound off the main thread) used to
# be ignored here. It was removed from this list when the advisory was actually
# resolved (issue #267), which is why no version is named: it is fixed rather
# than accepted. gettext-rs is on 0.8, where `setlocale` is `unsafe`, and the
# call lives in `rustconn-locale-sys` behind a guard that refuses to run once
# the thread count has grown past the baseline sampled on the first call, or
# once the startup window is sealed. The baseline rather than a literal "one
# thread" because shared-library ELF constructors legitimately spawn threads
# before `main()` is entered on some distributions (issue #271). What makes the
# call sound is the call site — `main()`, ahead of GTK/tokio/tracing; the guard
# is defence-in-depth against that ordering regressing. Do not re-add the
# ignore — if this advisory reappears, something regressed.
#
# Accepted *unmaintained* transitive crates (informational — `cargo audit`
# lists these as warnings; `unmaintained = "workspace"` below means cargo-deny
# does not fail on a transitive unmaintained crate, only a workspace-direct one,
# so none of these is in `ignore`). They are tracked here so an audit does not
# re-discover them as unknowns. None is a vulnerability; each is pinned by an
# upstream we do not control, and the fix is an upstream release:
# - unsafe-libyaml 0.2.11 — via serde_yaml_ng 0.10 (our YAML config/import
#   parser). serde_yaml_ng is the maintained successor to the archived
#   serde_yaml; its own libyaml port carries the advisory. Fix: serde_yaml_ng
#   replaces the bundled port, or a maintained YAML stack lands.
# - zbus_names 4.3.5, zvariant 5.15.1, zvariant_derive 5.15.1 — via zbus 5.19,
#   pulled by the desktop-integration stack (ashpd portals, ksni tray, oo7
#   Secret Service). The zbus project split these crates out and the advisory
#   DB flags the standalone crates as unmaintained ahead of a reshuffle. Fix: a
#   zbus release that folds them back in or renames them.
# - atomic-polyfill 1.0.3 — deep under the RDP smartcard path
#   (ironrdp -> ironrdp-connector -> sspi -> winscard -> iso7816 -> heapless).
#   heapless 0.7 depends on it; heapless 0.8 dropped it. Fix: sspi's winscard
#   chain moves to heapless 0.8.
# Last reviewed: 2026-10-20
# Next review: when serde_yaml_ng, zbus, or the sspi/ironrdp stack releases a
# new major version.
ignore = [
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "GPL-3.0-or-later",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
