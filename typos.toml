# Typos CLI configuration file
# ============================
# Run: `typos` (or `typos --format brief` for CI)
# Install: `cargo install typos-cli`
#
# How to fix errors:
# 1. Obvious typo: just fix it.
# 2. False-positive in binary/generated file: add to `extend-exclude`.
# 3. False-positive in source code:
#    3.1. Identifier name → `extend-identifiers`
#    3.2. Arbitrary word (docs, comments) → `extend-words`
#    3.3. Pattern → `extend-ignore-re`
#    3.4. Last resort: add file to `extend-exclude`

[files]
extend-exclude = [
    "*.mo",
    "*.po",
    "target/",
    ".flatpak-builder/",
    "Cargo.lock",
    "messages.mo",
    # Vendored verbatim from flatpak-builder-tools upstream. It carries an
    # upstream typo ("fragement"); patching vendored code to satisfy a local
    # spell checker would make the next re-vendor a conflict for no gain.
    "packaging/flatpak/flatpak-cargo-generator.py",
]

[default.extend-words]
# Project name
rustconn = "rustconn"
# GTK/GLib terms
gio = "gio"
glib = "glib"
adw = "adw"
# Ukrainian locale identifiers
uk = "uk"

# --- Vocabulary below added 2026-08-12, when `typos` was first wired into CI. ---
# It had never been run, so its whole 73-finding backlog surfaced at once. Every
# one turned out to be legitimate: proper nouns, crate names, upstream spellings,
# wire-format strings from other apps, or deliberate examples. Nothing in the
# codebase was misspelled, so nothing was "corrected" — several of those
# corrections would have introduced bugs. Each entry says why it stays.

# Vendor and product names that typos splits out of CamelCase.
# "Hashi" is the head of HashiCorp (Boundary, Vault).
Hashi = "Hashi"

# Huawei OLT MA5800 — Optical Line Terminal, real telecom hardware whose login
# banner the Telnet prompt detector matches on. Both cases appear (device class
# in prose, host name `olt-1` in tests).
OLT = "OLT"
olt = "olt"

# Asbru Connection Manager spells its own global variable `<GV:US_Parrallels_User>`
# with the double r. That string is wire format for the importer in
# rustconn-core/src/import/asbru.rs — "fixing" the spelling breaks the import.
Parrallels = "Parrallels"

# Crate names that appear in CHANGELOG dependency lists.
# flate2 (compression) and writeable (an ICU dependency).
flate = "flate"
writeable = "writeable"

# `gost` is the go-gost proxy relay binary (github.com/go-gost/gost), listed in
# ssh_tunnel.rs among the recognised byte-relay ProxyCommand front commands
# (nc/socat/corkscrew/cloudflared/…). It is a real command name, not a
# misspelling of "ghost" — "correcting" it would stop that relay being
# recognised and reintroduce the #322 password-prompt hang for gost users.
gost = "gost"

# Hyphenated prefixes: typos splits "mis-read" and "pre-empted" at the hyphen
# and then judges the fragments.
mis = "mis"
empted = "empted"

# Valid English variants that typos prefers to normalise. Both are established
# in this domain: GTK genuinely "unparents" a widget, and the -eable spelling is
# used consistently across the config parsers and their test names.
unparented = "unparented"
unparseable = "unparseable"

# Illustrative misspelling in docs/CLI_REFERENCE.md: the example output shows
# `rustconn-cli show "prodction"` answered by "Did you mean: Production DB?".
# The typo IS the demonstration.
prodction = "prodction"

# Spanish for "client", in the SSH agent key comment
# `backup-señor-cliente-final` used by the #278 regression tests. The fixture has
# to be non-ASCII text a real person would type — that is the entire bug: the
# comment is free text from `ssh-keygen -C`, and slicing it at a byte offset
# panicked inside a GTK signal handler. Anglicising the fixture would keep the
# spell checker quiet and cost the test its point.
cliente = "cliente"

[default.extend-identifiers]
# Field name in the vnc-rs crate's event struct. The source already flags it
# (`bottons: buttons, // Note: typo in vnc-rs library`); it is upstream's
# identifier and cannot be renamed from here.
bottons = "bottons"

[default]
extend-ignore-re = [
    # UUIDs
    "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}",
    # Hex strings (e.g. encryption salts, keys)
    "\\b[0-9a-fA-F]{32,}\\b",
    # Commit hashes in CHANGELOG.md
    "\\b[0-9a-f]{7,40}\\b",
    # Uzbek `qat'iy` ("fixed", as in `qat'iy o'lchamlar` — "fixed resolution"),
    # quoted in the 0.20.9 CHANGELOG entry about the uz catalogue's Resolution
    # labels. `typos` splits the word at the apostrophe and reads the `iy` tail
    # as a misspelling of "it". Scoped to this one word rather than allowing the
    # `iy` fragment everywhere, which would mask the real typo it stands for.
    # po/*.po is already excluded above, so the catalogue itself is unaffected.
    "qat'iy",
    # Base64 payload lines — PEM certificate fixtures in the .vv importer tests
    # are dense enough to contain accidental words ("UE", "Fo").
    # Note this is broader than its motivating case: it exempts ANY run of 40+
    # alphanumerics anywhere in the repo, not just PEM blocks. Accepted because
    # a 40-character unbroken alnum run is not prose in the first place, but do
    # not reach for it to silence an ordinary long identifier.
    "\\b[A-Za-z0-9+/]{40,}={0,2}\\b",
]
