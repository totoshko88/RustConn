app-id: io.github.totoshko88.RustConn
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rustconn

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib64/pkgconfig
  - /share/cmake
  - /share/doc
  - /share/info
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'

finish-args:
  # Library path for VTE (installed to lib64)
  - --env=LD_LIBRARY_PATH=/app/lib64:/app/lib
  # Wayland/X11 access
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Audio for RDP sessions
  - --socket=pulseaudio
  # Network access for SSH/RDP/VNC/SPICE connections
  - --share=network
  # Home directory access for SSH keys
  - --filesystem=home/.ssh:ro
  # AWS/GCP/Azure CLI config directories for ZeroTrust connections
  # .aws needs read-write: AWS CLI v2 SSO writes session tokens to ~/.aws/sso/cache/
  # and credential_process caches to ~/.aws/cli/cache/ during interactive login via local shell
  - --filesystem=home/.aws
  - --filesystem=home/.config/gcloud:ro
  - --filesystem=home/.azure:ro
  - --filesystem=home/.kube:ro
  # SSH agent socket
  - --socket=ssh-auth
  # D-Bus access for secret service (GNOME Keyring, KWallet)
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  # KeePassXC proxy access
  - --talk-name=org.keepassxc.KeePassXC.BrowserServer
  # System tray (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # Device access (serial ports for picocom require --device=all; no granular option exists)
  - --device=all
  # Host shell access: flatpak-spawn --host needs to talk to the Flatpak session helper
  - --talk-name=org.freedesktop.Flatpak
  # Downloads directory for SFTP file transfers via mc
  - --filesystem=xdg-download:create
  # Strip host-exported bash function mc() that sources /usr/share/mc/mc-wrapper.sh
  # (absent in sandbox); without this, the function shadows /app/bin/mc
  - --unset-env=BASH_FUNC_mc%%
  # Issue #158 — keep our translations OUT of the GNOME Locale extension subset
  # split. flatpak-builder slices /app/share/locale/<lang>/ into per-language
  # extension subsets that the user's host only pulls in for their system
  # locale. Anyone whose host LANG is en_US would then have NO rustconn.mo
  # files in the sandbox and could never switch the UI language. We install
  # translations under /app/share/rustconn/locale/ (untouched by builder) and
  # point the app at it via LOCALEDIR, which i18n::locale_dir() honors first.
  - --env=LOCALEDIR=/app/share/rustconn/locale

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/rustconn/cargo
    RUST_BACKTRACE: '1'
    AWS_LC_SYS_CMAKE_BUILDER: '0'

modules:
  - name: fast-float
    buildsystem: cmake-ninja
    config-opts:
      - -DFASTFLOAT_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/fastfloat/fast_float/archive/refs/tags/v8.2.10.tar.gz
        sha256: 76f958dd97b1cf4d8862d1f0986a47d4bdfa8845252bae15ef0f40de3b95961f

  - name: vte
    buildsystem: meson
    config-opts:
      - -Dglade=false
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dvapi=false
      - -Dicu=false
      - -Dgir=false
      - -Ddocs=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.80/vte-0.80.5.tar.xz
        sha256: 58a4e00ab5d4a95b4be4dc57b48308deafd72d6839dbbd076648fa353321cc41
        # Ceiling deliberate but unexplained until 0.21.0; the evidence, and the
        # steps to lift it, are recorded once in
        # packaging/flatpak/io.github.totoshko88.RustConn.yml rather than three
        # times here.
        x-checker-data:
          type: gnome
          name: vte
          stable-only: true
          versions:
            <: '0.81.0'

  - name: inetutils
    buildsystem: autotools
    config-opts:
      - --disable-servers
      - --disable-ifconfig
      - --disable-logger
      - --disable-syslogd
      - --disable-hostname
      - --disable-traceroute
      - --disable-talk
      - --disable-rcp
      - --disable-rlogin
      - --disable-rsh
      - --disable-rexec
    sources:
      - type: archive
        # `ftpmirror.gnu.org` is GNU's own redirector and is the primary because
        # `ftp.gnu.org` went unreachable during the 0.20.11 release and failed the
        # build twice; when it is down, a primary pointing at it costs every build
        # a 60 s timeout first. Both mirrors below were verified to serve a
        # byte-identical tarball. The sha256 is what actually protects us.
        url: https://ftpmirror.gnu.org/inetutils/inetutils-2.8.tar.gz
        mirror-urls:
          - https://ftp.gnu.org/gnu/inetutils/inetutils-2.8.tar.gz
          - https://mirrors.kernel.org/gnu/inetutils/inetutils-2.8.tar.gz
        sha256: 57b3cf4f77555992881e5ba2a09a63b05aa2c56342a60ed4305b5f45938390b5
        x-checker-data:
          type: anitya
          project-id: 1579
          stable-only: true
          url-template: https://ftpmirror.gnu.org/inetutils/inetutils-$version.tar.gz

  - name: picocom
    buildsystem: simple
    build-commands:
      - make
      - install -Dm755 picocom /app/bin/picocom
    sources:
      - type: archive
        url: https://github.com/npat-efault/picocom/archive/refs/tags/3.1.tar.gz
        sha256: e6761ca932ffc6d09bd6b11ff018bdaf70b287ce518b3282d29e0270e88420bb
        x-checker-data:
          type: anitya
          project-id: 7592
          stable-only: true
          url-template: https://github.com/npat-efault/picocom/archive/refs/tags/$version.tar.gz

  - name: slang
    buildsystem: autotools
    config-opts:
      - --without-png
      - --without-pcre
      - --without-onig
    sources:
      - type: archive
        url: https://www.jedsoft.org/releases/slang/slang-2.3.3.tar.bz2
        sha256: f9145054ae131973c61208ea82486d5dd10e3c5cdad23b7c4a0617743c8f5a18

  - name: mc
    buildsystem: autotools
    config-opts:
      # Use slang instead of ncurses — mc's ncurses backend cannot parse
      # SGR mouse sequences (mode 1006) from VTE 0.80+, causing raw escape
      # fragments to appear as text artifacts on mouse clicks.
      - --with-screen=slang
      - --disable-vfs-sftp
    post-install:
      # Host distros (e.g. openSUSE) export a bash function mc() that sources
      # /usr/share/mc/mc-wrapper.sh — a path absent in the Flatpak sandbox.
      # The exported function shadows /app/bin/mc. Fix: move the real binary
      # to mc.bin, patch mc-wrapper.sh to call mc.bin, and install a shell
      # wrapper at /app/bin/mc that unsets the inherited function then sources
      # the correct wrapper script.
      - mv /app/bin/mc /app/bin/mc.bin
      - sed -i 's|/app/bin/mc |/app/bin/mc.bin |g' /app/libexec/mc/mc-wrapper.sh
      - |
        printf '%s\n' '#!/bin/bash' 'unset -f mc 2>/dev/null' '. /app/libexec/mc/mc-wrapper.sh "$@"' > /app/bin/mc
      - chmod 755 /app/bin/mc
    sources:
      - type: archive
        url: http://ftp.midnight-commander.org/mc-4.8.33.tar.xz
        # Verified byte-identical, and https where the primary is plain http.
        mirror-urls:
          - https://ftp.osuosl.org/pub/midnightcommander/mc-4.8.33.tar.xz
        sha256: cae149d42f844e5185d8c81d7db3913a8fa214c65f852200a9d896b468af164c
        x-checker-data:
          type: anitya
          project-id: 1894
          stable-only: true
          url-template: http://ftp.midnight-commander.org/mc-$version.tar.xz

  - name: waypipe
    buildsystem: meson
    config-opts:
      # Build the C-only version — avoids pulling in cargo dependencies for waypipe itself
      - -Dbuild_rs=false
      - -Dbuild_c=true
      - -Dman-pages=disabled
      - -Dtests=false
      # Compression support (lz4/zstd available in GNOME SDK)
      - -Dwith_lz4=enabled
      - -Dwith_zstd=enabled
      # Disable GPU buffer sharing and video codec (not needed for basic Wayland forwarding)
      - -Dwith_dmabuf=disabled
      - -Dwith_video=disabled
    post-install:
      # C-only build installs as "waypipe-c"; create symlink so detection finds "waypipe"
      - ln -sf waypipe-c /app/bin/waypipe
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/mstoeckl/waypipe/-/archive/v0.11.2/waypipe-v0.11.2.tar.gz
        sha256: 70914b590b2b9a74a16fe9936bb7dba6b3eb59466ed17aaba2613c9fa09b8dad

  - name: rustconn-terminfo
    buildsystem: simple
    build-commands:
      # Create a custom terminfo entry identical to xterm-256color but
      # without the XM extended capability. XM tells ncurses/slang to
      # negotiate SGR mouse mode (1006) with VTE 0.80+, but mc cannot
      # parse SGR-encoded mouse events — causing raw escape fragments
      # like "7;6M7;6m" on every click. Removing XM prevents the
      # negotiation so VTE falls back to X10/normal mouse mode.
      - infocmp -x -1 xterm-256color | sed 's/xterm-256color/rustconn-256color/' | sed '/XM=/d' | tic -x -o /app/share/terminfo -
      # Ensure `clear` is available inside the sandbox.
      # GNOME Platform runtime may not include ncurses-utils, so we
      # create a minimal shell wrapper that uses ANSI escape sequences
      # directly — no ncurses dependency required.
      - |
        printf '%s\n' '#!/bin/sh' '# clear — minimal replacement using ANSI escape sequences' '# Clears visible screen and scrollback buffer (E3 equivalent).' 'printf "\033[H\033[2J\033[3J"' > /app/bin/clear
      - chmod 755 /app/bin/clear
    sources: []

  # cJSON — required so FreeRDP's WinPR builds with JSON support
  # (WITH_WINPR_JSON=ON). Without a JSON backend WinPR falls back to
  # json-stub.c and silently ignores sdl-freerdp.json, so the SDL client's
  # hotkey configuration (e.g. disabling Right Shift + D) has no effect (#183).
  # Built static and linked privately into libwinpr; no runtime .so needed.
  - name: cjson
    buildsystem: cmake-ninja
    config-opts:
      # cJSON 1.7.19 declares cmake_minimum_required < 3.5, removed in CMake 4.x
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DENABLE_CJSON_TEST=OFF
      - -DENABLE_CJSON_UTILS=OFF
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    sources:
      - type: archive
        url: https://github.com/DaveGamble/cJSON/archive/refs/tags/v1.7.19.tar.gz
        sha256: 7fa616e3046edfa7a28a32d5f9eacfd23f92900fe1f8ccd988c1662f30454562
        x-checker-data:
          type: anitya
          project-id: 21330
          stable-only: true
          url-template: https://github.com/DaveGamble/cJSON/archive/refs/tags/v$version.tar.gz
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - '*.a'

  - name: freerdp
    buildsystem: cmake-ninja
    config-opts:
      - -DALLOW_IN_SOURCE_BUILD=ON
      - -DWITH_SERVER=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_PLATFORM_SERVER=OFF
      - -DWITH_X11=OFF
      - -DWITH_CLIENT_SDL2=OFF
      - -DWITH_CLIENT_SDL3=ON
      - -DCHANNEL_URBDRC=OFF
      # Audio backends are pinned rather than left to autodetection: they
      # default to ON but degrade to OFF silently when the SDK headers are
      # missing, which would ship a FreeRDP that cannot play session sound at
      # all (issue #245). ON makes a missing backend a build failure instead.
      - -DWITH_PULSE=ON
      - -DWITH_ALSA=ON
      - -DWITH_CUPS=OFF
      - -DWITH_PCSC=OFF
      - -DWITH_SWSCALE=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_AAD=OFF
      - -DWITH_WEBVIEW=OFF
      - -DWITH_FUSE=OFF
      - -DWITH_KRB5=OFF
      - -DBUILD_TESTING=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_RDTK=OFF
    sources:
      - type: archive
        url: https://pub.freerdp.com/releases/freerdp-3.31.1.tar.xz
        sha256: e679ab1400b4d3f829786782d16e318d72f4712c9d29c041a86f5cc1a2a4ec94
        x-checker-data:
          type: anitya
          project-id: 10442
          stable-only: true
          url-template: https://pub.freerdp.com/releases/freerdp-$version.tar.xz

  # OpenH264 — the decoder the *embedded* RDP client dlopens at runtime, not
  # something FreeRDP above links against. `gfx_handler.rs` looks for
  # `/app/lib/libopenh264.so` plus a versioned soname in `/app/lib` and
  # `/app/lib64`; when nothing is found an AVC420/AVC444 GFX session drops to
  # the RemoteFX path without saying so.
  #
  # All three Flatpak manifests need it, and until 0.21.6 only
  # packaging/flatpak/io.github.totoshko88.RustConn.yml had it: Flathub shipped
  # with no H.264 decoder at all, and a local build could not reproduce an H.264
  # bug from the build it exists to mirror. Bundled rather than taken from
  # org.freedesktop.Platform.openh264 because freedesktop dropped that extension
  # from the runtime in 2025 — there is no extension left to depend on.
  - name: openh264
    buildsystem: meson
    config-opts:
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://github.com/cisco/openh264/archive/refs/tags/v2.6.0.tar.gz
        sha256: 558544ad358283a7ab2930d69a9ceddf913f4a51ee9bf1bfb9e377322af81a69
        x-checker-data:
          type: anitya
          project-id: 15752
          stable-only: true
          url-template: https://github.com/cisco/openh264/archive/refs/tags/v$version.tar.gz

  - name: rustconn
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
        PKG_CONFIG_PATH: /app/lib64/pkgconfig:/app/lib/pkgconfig:/app/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
    build-commands:
      # GNOME 50 SDK (GCC 15) appends -O2 via CFLAGS after aws-lc-sys sets -O0 for
      # jitterentropy-base.c, which triggers a #error requiring -O0. The wrapper
      # detects jitterentropy source files and forces -O0 at the very end.
      - |
        printf '%s\n' '#!/bin/sh' 'case "$*" in' '  *jitterentropy*)' '    exec /usr/bin/cc "$@" -O0' '    ;;' '  *)' '    exec /usr/bin/cc "$@"' '    ;;' 'esac' > /app/bin/cc-wrap
        chmod +x /app/bin/cc-wrap
      # Rename deprecated cargo/config to config.toml
      - if [ -f cargo/config ]; then mv cargo/config cargo/config.toml; fi
      # Features the GNOME 50 runtime can actually back, verified with pkg-config
      # inside org.gnome.Sdk//50: GTK 4.22.4, libadwaita 1.9.3. VTE comes from the
      # bundled 0.80.5 module above, not the runtime, so `vte-0-78` is satisfied by
      # this manifest rather than by GNOME.
      #
      # `vte-0-78` is what makes the Command monitor mode reachable — without it the
      # mode is hidden from the picker and never fires, which is how it shipped when
      # the feature was added and nothing here passed it.
      #
      # `vte-0-80` is deliberately not passed: by the feature ladder it implies
      # `vte-0-78` and adds only the image termprops, which `vte4` 0.10 does not bind
      # and VTE never populates. Naming it would claim a capability nothing reads.
      - CC=/app/bin/cc-wrap cargo build --release -p rustconn --features 'adw-1-8,vte-0-78,gtk-4-22'
      - CC=/app/bin/cc-wrap cargo build --release -p rustconn-cli --features full
      - install -Dm755 target/release/rustconn /app/bin/rustconn
      - install -Dm755 target/release/rustconn-cli /app/bin/rustconn-cli
      - install -Dm644 rustconn/assets/io.github.totoshko88.RustConn.desktop /app/share/applications/io.github.totoshko88.RustConn.desktop
      - install -Dm644 rustconn/assets/io.github.totoshko88.RustConn-rdp.xml /app/share/mime/packages/io.github.totoshko88.RustConn-rdp.xml
      - install -Dm644 rustconn/assets/io.github.totoshko88.RustConn-vv.xml /app/share/mime/packages/io.github.totoshko88.RustConn-vv.xml
      - install -Dm644 rustconn/assets/io.github.totoshko88.RustConn.metainfo.xml /app/share/metainfo/io.github.totoshko88.RustConn.metainfo.xml
      - install -Dm644 rustconn/assets/icons/hicolor/scalable/apps/io.github.totoshko88.RustConn.svg /app/share/icons/hicolor/scalable/apps/io.github.totoshko88.RustConn.svg
      # Install locale files (compile .po to .mo).
      # Path NOT under /app/share/locale/ — flatpak-builder splits that into
      # per-language Locale extension subsets (issue #158). LOCALEDIR in
      # finish-args points the gettext lookup here.
      - |
        for po_file in po/*.po; do
          [ -f "$po_file" ] || continue
          lang=$(basename "$po_file" .po)
          mkdir -p /app/share/rustconn/locale/$lang/LC_MESSAGES
          msgfmt -o /app/share/rustconn/locale/$lang/LC_MESSAGES/rustconn.mo "$po_file"
        done
    sources:
      - type: git
        url: https://github.com/totoshko88/RustConn.git
        # Tag only, deliberately without `commit:`. The release commit does not
        # exist while this manifest is being prepared, so pinning it here is a
        # chicken-and-egg problem and any placeholder would be a fake pin.
        # The immutable commit is added once the tag exists — by hand or by the
        # Flathub bot — in the Flathub repository, not here.
        tag: v0.21.7
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - cargo-sources.json
