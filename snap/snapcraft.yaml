name: rustconn
base: core26
version: '0.24.2'
title: RustConn
summary: Manage remote connections easily
description: |
  RustConn is a modern connection manager for Linux with a GTK4/Wayland-native
  interface. Manage SSH, RDP, VNC, SPICE, MOSH, Telnet, Serial, Kubernetes, and
  Zero Trust connections from a single application. Core protocols use embedded
  Rust implementations — no external dependencies required.

  Supported protocols (embedded Rust implementations):
  - SSH with a built-in VTE terminal, split view, and scrollbar
  - RDP via IronRDP (embedded), with a bundled FreeRDP client for external mode
  - VNC via vnc-rs (embedded)
  - MOSH with predict mode and a UDP port range
  - Telnet, Serial consoles (RS-232/USB), and Kubernetes pod shells
  - Managed access gateways for the major cloud providers

  Sync between your own devices:
  - Share your connection list through a folder you already sync
    (Google Drive, Syncthing, Nextcloud, Dropbox, USB)
  - Group and simple sync modes with UUID-based merge

  File transfer:
  - SFTP file browser with split-panel navigation

  Organization:
  - Groups, tags, templates, and smart folders
  - Connection history and statistics
  - Optional session logs
  - Tab Overview, Tab Pinning, and Tab Switcher

  Import/Export:
  - Asbru-CM, Remmina, SSH config, Ansible inventory, CSV,
    RDP files, libvirt, and the native format (.rcn)

  Credential storage (all optional, user-configured):
  - System keyring (GNOME Keyring / KDE Wallet)
  - KeePassXC and popular password-manager CLIs

  Productivity:
  - Split terminals with multi-panel layouts
  - Reusable command snippets
  - Custom terminal themes and per-connection color overrides
  - Resource usage overview (CPU, memory, disk, network)
  - Wake-on-LAN with auto-connect

  Note: This snap uses strict confinement with embedded protocol clients
  (SSH, RDP via IronRDP, VNC via vnc-rs) and FreeRDP's X11 client bundled in
  the snap. Optional helper CLIs are downloaded on demand into the snap's
  writable user data and run inside the sandbox — no host access is required.
  SPICE is not available in the snap: no viewer is bundled, and strict
  confinement cannot start one from the host.

  Web connections open in an embedded WebKitGTK tab, your system browser, or a
  browser command of your choice. In the snap, embedded web content runs without
  WebKit's own bubblewrap sandbox (WebKit turns it off inside snaps) and is
  confined only by the snap's strict confinement; see the snap documentation.

grade: stable
confinement: strict
icon: rustconn/assets/icons/hicolor/256x256/apps/io.github.totoshko88.RustConn.png
license: GPL-3.0-or-later
# Store-listing links. snapd copies these into the built snap.yaml `links:`
# block and the Snap Store shows them on the listing (Website, Source code,
# Report a bug, Donations). Each field is a list because the metadata spec lets
# a field carry several links, and — crucially — an e-mail contact MUST be
# `mailto:`-prefixed: a bare address is an invalid link entry and the store
# drops the whole `links:` block on the "Update metadata on release" sync,
# which is why the Donations / Source code / Report-a-bug links vanished after
# a release (issue: links disappear on Snapcraft after release).
website:
  - https://github.com/totoshko88/RustConn
source-code:
  - https://github.com/totoshko88/RustConn
issues:
  - https://github.com/totoshko88/RustConn/issues
donation:
  - https://donatello.to/totoshko88
contact:
  - https://github.com/totoshko88/RustConn/issues
  - mailto:totoshko88@gmail.com

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

# NOTE: GTK4/libadwaita runtime (GTK, Pango, Cairo, gdk-pixbuf, graphene,
# Mesa/GL, GNOME themes), the desktop-launch command-chain, the correct
# XDG/D-Bus/fontconfig environment AND the matching AppArmor accesses are all
# provided by the `gnome` extension via the gnome-core26 platform snap (build
# side: gnome-core26-sdk; GPU drivers: the gpu-2604 content interface from
# mesa-2604). We therefore do NOT stage GTK here, do NOT define a custom
# launcher wrapper, and do NOT hand-roll GTK environment variables — the
# earlier manual approach (from before the extension supported core26) is what
# broke startup under strict confinement on Ubuntu 26.04 (issue #174).
#
# History: core26 was tried in v0.23.2 and reverted because the `gnome`
# extension rejected `base: core26`. Snapcraft 9.2 added core26 support to the
# extension, so the snap is on core26 again (Ubuntu 26.04 LTS archive for
# build-packages/stage-packages, GTK 4.24 + libadwaita 1.10 from the platform).
#
# libadwaita: the platform ships libadwaita 1.10, so the GUI is built WITH
# `--features adw-1-8` (which implies adw-1-6 and adw-1-7), the same libadwaita
# widget tier as the Flatpak: AdwSpinner, AdwToggleGroup, AdwShortcutsDialog and
# friends. The Flatpak builds `adw-1-10,vte-0-84,gtk-4-24`; the snap does not
# enable the vte and gtk rungs. The
# default (no-feature) build keeps the 1.5 fallbacks for Ubuntu 24.04 deb/AppImage
# targets; the snap simply no longer needs them.
#
# Differences from core24 that this file accounts for:
#   * The extension no longer adds the `gsettings` plug on core26, so the
#     `rustconn` app declares it explicitly (same behaviour as on core24).
#   * core26 ships no Python. The pip-installed Zero Trust CLIs (Azure `az`,
#     Oracle `oci`) use the Python 3.14 of the gnome-core26 platform; see the
#     note above the `rustconn` part for why no Python is staged here.
#   * The extension adds a `gnome/cleanup` part that prunes from prime every
#     shared library already supplied by gnome-core26-sdk / gtk-common-themes.
#     It makes the manual `prime:` exclusion list on the `rustconn` part
#     redundant; the list is kept as belt and braces (harmless, and it documents
#     why the libvte dependency closure must not ship a second GTK stack). It can
#     be dropped once a smoke test shows the extension cleanup alone is enough.
#   * Part names must not contain `/`, and scriptlets use `craftctl` instead of
#     `snapcraftctl`. This file uses neither a slash in a part name nor either
#     command.
#   * The embedded web browser (`web-embedded`, WebKitGTK 6.0, issue #244) is
#     on. WebKit comes from the gnome-core26 platform, not from this snap, and
#     the core26 `gnome` extension adds the `layout:` bind WebKit needs for its
#     helper processes; see the comment above `cargo build` below.
# Still to do by hand before a release: the strict-confinement smoke test on a
# real Ubuntu 26.04 session (issue #174 was a startup break under strict
# confinement), with gnome-core26 and mesa-2604 installed, and an embedded Web
# connection (the page renders, cookies survive a restart, the SSH SOCKS tunnel
# works) under strict confinement.

plugs:
  ssh-keys:
    interface: ssh-keys
  serial-port:
    interface: serial-port
  aws-credentials:
    interface: personal-files
    read:
      - $HOME/.aws
    write:
      - $HOME/.aws/sso/cache
  gcloud-credentials:
    interface: personal-files
    read:
      - $HOME/.config/gcloud
  azure-credentials:
    interface: personal-files
    read:
      - $HOME/.azure
  oci-credentials:
    interface: personal-files
    read:
      - $HOME/.oci
  kube-credentials:
    interface: personal-files
    read:
      - $HOME/.kube
  # The GTK/GIO network monitor asks the desktop portal
  # (org.freedesktop.portal.NetworkMonitor) whether the network is up. Under
  # strict confinement that call is refused ("not available inside the sandbox",
  # issue #342) without this interface, and GIO logs a GLib-GIO-WARNING on every
  # query. `network-status` grants the portal NetworkMonitor access. It is
  # auto-connected on the store, so no manual `snap connect` is needed.
  network-status:
    interface: network-status

# The GTK application owns its well-known D-Bus name (matching the app ID /
# desktop file) on the session bus via `g_application_register`. Under strict
# confinement the snap may only own names derived from the snap name, so we
# declare a `dbus` slot granting AppArmor permission to own the app-ID name.
# The providing snap is auto-granted ownership, so no manual connection is
# needed. Without this the app fails to register ("not allowed to own the
# service ... due to AppArmor policy").
slots:
  dbus-rustconn:
    interface: dbus
    bus: session
    name: io.github.totoshko88.RustConn

apps:
  rustconn:
    command: usr/bin/rustconn
    extensions: [gnome]
    desktop: usr/share/applications/io.github.totoshko88.RustConn.desktop
    common-id: io.github.totoshko88.RustConn
    slots:
      - dbus-rustconn
    plugs:
      - audio-playback
      - network
      - network-bind
      - network-status
      # The gnome extension added this plug itself on core24 but no longer does
      # on core26; declare it so GSettings keeps using the host settings
      # database instead of a private one.
      - gsettings
      - home
      - ssh-keys
      - serial-port
      - password-manager-service
      - aws-credentials
      - gcloud-credentials
      - azure-credentials
      - oci-credentials
      - kube-credentials

  rustconn-cli:
    command: usr/bin/rustconn-cli
    plugs:
      - network
      - home
      - ssh-keys
      - serial-port
      # Keyring access for `rustconn-cli secret` — keep in sync with the
      # GUI app plugs above
      - password-manager-service
      - aws-credentials
      - gcloud-credentials
      - azure-credentials
      - oci-credentials
      - kube-credentials

parts:
  # Snapcraft 9.0 Rust plugin validates that 'rustup' is available at pull time
  # BEFORE running override-build. When building on Launchpad (clean container
  # with no pre-installed Rust toolchain), the validation fails because rustup
  # isn't on PATH yet. Since we use override-build anyway (to control feature
  # flags and LTO), just install Rust here and use plugin: nil for the main part.
  rust-deps:
    plugin: nil
    override-pull: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
        -y --default-toolchain 1.95 --profile minimal
    build-packages:
      - curl
    prime:
      - -*

  # NOTE: no Python part. core26 ships no Python and the Snapcraft migration
  # guide suggests a `python-runtime` part (python3-minimal, python3.14-minimal,
  # python3.14-venv, libpython3.14-*). We tried exactly that and it does not
  # work next to the gnome extension: its `gnome/cleanup` part deletes from prime
  # every `*.so` that also exists in gnome-core26-sdk, which emptied the staged
  # `usr/lib/python3.14/lib-dynload` (_ssl, _hashlib, _ctypes, _sqlite3, ...) and
  # left a $SNAP/usr/bin/python3 that shadows a working interpreter on PATH but
  # cannot `import ssl`, so pip could not reach any index. The gnome-core26
  # platform already ships a complete Python 3.14 (interpreter, stdlib,
  # lib-dynload, pip/setuptools wheels) and its launcher appends
  # $SNAP_DESKTOP_RUNTIME/usr/bin to PATH, so the `python3` that RustConn runs
  # for the pip-installed Azure `az` / Oracle `oci` Zero Trust CLIs is the
  # platform's. Do NOT stage python3 here again unless the cleanup is bypassed.

  rustconn:
    plugin: nil
    source: .
    after: [rust-deps]
    build-packages:
      # GTK4/libadwaita/GLib dev files also come from the gnome SDK (added by
      # the `gnome` extension build environment, GTK 4.24 + libadwaita 1.10);
      # we keep the distro dev packages too so the workspace `cargo build`
      # always resolves gtk4-4.0.pc / libadwaita-1.pc and so libvte's dev
      # dependencies are satisfied. The SDK paths come first on
      # PKG_CONFIG_PATH, so the SDK copy wins. VTE for GTK4 is NOT in the SDK.
      - libgtk-4-dev
      - libadwaita-1-dev
      - libvte-2.91-gtk4-dev
      - libssl-dev
      - libasound2-dev
      - pkg-config
      - clang
      - cmake
      - gettext
    stage-packages:
      # VTE (GTK4 terminal widget, 0.84 from the Ubuntu 26.04 archive) is NOT
      # provided by the gnome-core26 platform at runtime, so it MUST be staged.
      # But the .deb drags the whole GTK4 stack
      # (libgtk-4, GLib, Pango, Cairo, gdk-pixbuf, graphene, harfbuzz, librsvg)
      # as dependencies. Shipping a second copy of those is fatal: the platform's
      # libadwaita would load against OUR libgtk-4 (ABI mismatch → transparent
      # window) and the platform's SVG loader against OUR librsvg (→ broken
      # icons). The `prime:` block below drops every GTK/GLib/render library so
      # the platform's single, matched copy is used; only libvte itself is kept.
      - libvte-2.91-gtk4-0
      - libasound2t64
      - libssl3t64
      - openssh-client
      - mc
      - picocom
      - inetutils-telnet
      - waypipe
      # Python for the pip-based Zero Trust CLIs comes from the gnome-core26
      # platform (see the note above this part), not from stage-packages.
      # FreeRDP's X11 client (`xfreerdp3`), the external RDP client for what the
      # embedded IronRDP client cannot do: the legacy RDP security layer and
      # TLS-only servers (e.g. Windows 2008 R2), RemoteApp, audio left on the
      # remote machine, RD Gateway, and the external client's Smart sizing and
      # Dynamic resolution switches (issues #341, #342). Without it those
      # connections had nowhere to fall back to in the snap. The X11 client
      # rather than wlfreerdp3, which upstream deprecated (#340): it runs
      # through XWayland on a Wayland session and it is the client RemoteApp
      # needs. Ubuntu 26.04 also packages the SDL client (`freerdp3-sdl`); it is
      # a possible follow-up, but is deliberately not switched to here. The launcher finds
      # it in $SNAP/usr/bin. Most of its dependencies are plain Ubuntu libraries
      # (Kerberos, ICU, CUPS, PulseAudio, libusb, FUSE, Opus). On core26 four
      # of them are not staged here: libX11.so.6, libXext.so.6, libXfixes.so.3
      # and libxml2.so.16 reach `xfreerdp3` only through the gpu-2604 wrapper,
      # from the mesa-2604 content snap, so the snap depends on mesa-2604 being
      # connected for the X11 client to start. The one GTK-stack library it
      # links, libcairo, is already dropped by the `prime:` block below in
      # favour of the platform's copy.
      - freerdp3-x11
    prime:
      # Drop the GTK4/GLib/rendering stack dragged in by libvte's dependencies.
      # All of these are provided by the gnome-core26 platform; staging a second
      # copy causes the platform libadwaita/loaders to bind against our copies
      # (ABI mismatch → transparent window + broken icons). Keeping a single
      # instance of GTK, GLib and GObject across the whole process is mandatory.
      # On core26 the extension's `gnome/cleanup` part prunes the same libraries
      # (and more) after the fact; this list is now redundant and kept as an
      # explicit, reviewable statement of intent.
      # libvte itself (libvte-2.91-gtk4.so) is intentionally NOT excluded.
      # The `usr/lib/*/...` wildcard matches the arch-triplet directory
      # (x86_64-linux-gnu on amd64, aarch64-linux-gnu on arm64) so the dedup
      # works on both architectures.
      - -usr/lib/*/libgtk-4.so*
      - -usr/lib/*/libgdk_pixbuf-2.0.so*
      - -usr/lib/*/gdk-pixbuf-2.0
      - -usr/lib/*/librsvg-2.so*
      - -usr/lib/*/libpango-1.0.so*
      - -usr/lib/*/libpangocairo-1.0.so*
      - -usr/lib/*/libpangoft2-1.0.so*
      - -usr/lib/*/libcairo.so*
      - -usr/lib/*/libcairo-gobject.so*
      - -usr/lib/*/libcairo-script-interpreter.so*
      - -usr/lib/*/libgraphene-1.0.so*
      - -usr/lib/*/libharfbuzz.so*
      - -usr/lib/*/libharfbuzz-subset.so*
      - -usr/lib/*/libglib-2.0.so*
      - -usr/lib/*/libgio-2.0.so*
      - -usr/lib/*/libgobject-2.0.so*
      - -usr/lib/*/libgmodule-2.0.so*
      - -usr/lib/*/libgthread-2.0.so*
      - -usr/lib/*/libepoxy.so*
    override-build: |
      # Ensure cargo/rustc from rust-deps are on PATH
      export PATH="$HOME/.cargo/bin:$PATH"
      # The `rust-deps` part installs rustup with --default-toolchain 1.95 on
      # purpose (MSRV), and cargo on that PATH is a rustup proxy, so it WOULD
      # read the repo's rust-toolchain.toml and pull 1.99.0 instead. This env
      # var outranks that file and keeps the snap on the toolchain the part
      # deliberately installed — otherwise adding a dev-toolchain pin would have
      # silently changed what the snap compiles with, and downloaded a second
      # toolchain to do it. Keep this in sync with rust-deps' --default-toolchain.
      export RUSTUP_TOOLCHAIN=1.95
      # Pin pango to a single source at link time (issue #198). The gnome
      # extension stages the gnome-core26-sdk's libpangoft2-1.0, but the build
      # also has the Ubuntu 26.04 libpango-1.0 in /usr/lib. On arm64 on core24
      # these two halves of pango diverged (the SDK libpangoft2 referenced
      # pango_font_description_{get,set}_features, absent from the older noble
      # libpango), so ld failed with "undefined reference" at link. Prepend the
      # SDK arch-triplet lib dir to the rustc link search path so BOTH pango
      # libs resolve from the SDK — the same copy used at runtime. The SDK path
      # comes from the extension's SNAPCRAFT_GNOME_SDK (gnome-core26-sdk), with
      # the literal path as fallback so this can never silently become a no-op.
      SDK_LIB="${SNAPCRAFT_GNOME_SDK:-/snap/gnome-core26-sdk/current}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"
      export RUSTFLAGS="-L native=${SDK_LIB} ${RUSTFLAGS:-}"
      # Single workspace build: the crate's default features plus adw-1-8, the
      # same libadwaita widget tier as packaging/flatpak, which builds
      # `adw-1-10,vte-0-84,gtk-4-24` (the gnome-core26 platform provides
      # libadwaita 1.10; adw-1-8 implies adw-1-7 and adw-1-6). Global LTO via
      # --config keeps the binary small (equivalent to the plugin's
      # rust-use-global-lto).
      #
      # Default features are used on purpose instead of a hand-written list: a
      # new default feature then reaches the snap without anyone remembering to
      # copy it here, and one that needs a library missing from the runtime is
      # caught by scripts/check-snap-runtime-libs.sh. To drop a default feature
      # from the snap, go back to `--no-default-features` with an explicit list
      # and say here why.
      #
      # That set includes web-embedded (issue #244): the app links
      # libwebkitgtk-6.0.so.4 and libjavascriptcoregtk-6.0.so.1. They are not
      # staged by this snap; they come from the gnome-core26 platform (WebKitGTK
      # 2.52, updated with the platform). WebKit looks up its helper processes
      # (WebKitWebProcess, WebKitNetworkProcess, the injected bundle) at the
      # compiled-in /usr/lib/<triplet>/webkitgtk-6.0, and the core26 `gnome`
      # extension adds the `layout:` bind for that path, so this file adds none.
      # If WebKit cannot spawn a helper it aborts the whole RustConn process.
      #
      # SECURITY: inside any snap (SNAP, SNAP_NAME and SNAP_REVISION set) WebKit
      # itself skips its bubblewrap sandbox and spawns its web and network
      # processes unsandboxed. They run under this snap's strict-confinement
      # profile with every plug the app has (home, ssh-keys, the *-credentials
      # personal-files, password-manager-service, network, network-bind and the
      # x11 plug the extension adds), so a compromised page has the same access
      # as RustConn itself. WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS
      # is deliberately NOT set: it would change nothing here and only suggest
      # that a sandbox had been in use. The trade-off needs the maintainer's
      # explicit approval before a release; see docs/SNAP.md, "Embedded web
      # browser (WebKitGTK)".
      cargo build --release \
        --config 'profile.release.lto = true' \
        --config 'profile.release.codegen-units = 1' \
        --features adw-1-8 \
        -p rustconn
      cargo build --release \
        --config 'profile.release.lto = true' \
        --config 'profile.release.codegen-units = 1' \
        -p rustconn-cli --features full
      install -Dm755 target/release/rustconn "$CRAFT_PART_INSTALL/usr/bin/rustconn"
      install -Dm755 target/release/rustconn-cli "$CRAFT_PART_INSTALL/usr/bin/rustconn-cli"
      mkdir -p $CRAFT_PART_INSTALL/usr/share/applications
      mkdir -p $CRAFT_PART_INSTALL/usr/share/icons
      mkdir -p $CRAFT_PART_INSTALL/usr/share/metainfo
      cp rustconn/assets/io.github.totoshko88.RustConn.desktop $CRAFT_PART_INSTALL/usr/share/applications/
      cp rustconn/assets/io.github.totoshko88.RustConn.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/
      cp -r rustconn/assets/icons/hicolor $CRAFT_PART_INSTALL/usr/share/icons/
      for po_file in po/*.po; do
        [ -f "$po_file" ] || continue
        lang=$(basename "$po_file" .po)
        mkdir -p "$CRAFT_PART_INSTALL/usr/share/locale/$lang/LC_MESSAGES"
        msgfmt -o "$CRAFT_PART_INSTALL/usr/share/locale/$lang/LC_MESSAGES/rustconn.mo" "$po_file"
      done
