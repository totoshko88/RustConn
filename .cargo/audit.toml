# cargo-audit configuration for RustConn
# Keeps `cargo audit` consistent with the accepted advisories in deny.toml.
#
# Accepted transitive advisory:
# - RUSTSEC-2023-0071: rsa 0.10.0-rc.18 Marvin Attack (timing sidechannel,
#   medium 5.9). rsa 0.10.0 (2026-11-08) is the patched release, but it is
#   out of reach: ironrdp-connector 0.12.0 (latest) pins picky =7.0.0-rc.26,
#   and picky, sspi 0.23 and winscard 0.4 pin rsa =0.10.0-rc.18.
#   RustConn is a local desktop client: it does not host an RSA decryption
#   oracle and does not perform attacker-triggerable repeated private-key
#   operations, so the timing sidechannel is not exploitable in this context.
#   Upgrade path: picky/sspi/winscard move to rsa 0.10.0 and
#   ironrdp-connector follows; then drop this ignore.
#   Re-checked 2026-11-13: sspi 0.23.1, winscard 0.4.1 and picky
#   7.0.0-rc.29 still require rsa =0.10.0-rc.18.
#   Last reviewed: 2026-11-13
#   Next review: when picky, sspi or ironrdp-connector publishes a new version.
#
# RUSTSEC-2026-0244 (gettext-rs `setlocale` unsound off the main thread) used to
# be listed here. It was dropped when the advisory was resolved (issue #267)
# rather than at some release boundary, so no version is named: gettext-rs 0.8
# marks `setlocale` `unsafe`, and the only call sits in `rustconn-locale-sys`
# behind a guard that refuses to run once the thread count has grown past the
# baseline sampled on the first call, or once the startup window is sealed. The
# baseline rather than a literal "one thread" because shared-library ELF
# constructors legitimately spawn threads before `main()` on some distributions
# (issue #271). Do not re-add the ignore.

[advisories]
ignore = ["RUSTSEC-2023-0071"]
