[package]
name = "rustconn-pty-sys"
description = "Isolated FFI helper for RustConn's PTY layer: openpty, controlling-terminal setup, TIOCSWINSZ and close-on-exec fd duplication."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libc = { workspace = true }
# Only `nix::pty::openpty` is used, which lives behind the `term` feature.
nix = { workspace = true, features = ["term"] }

# This crate is the single sanctioned location for `unsafe` in the workspace
# (see rust-pragmatic-guidelines.md, M-UNSAFE: isolate FFI in a small -sys
# crate), and it opts into the workspace lint set like every other crate. The
# single exemption it needs is re-opened in src/lib.rs with a crate-level
# `#![expect(unsafe_code, reason = "…")]`, which is possible because the workspace
# sets that lint to `deny` rather than `forbid`. Declaring `[lints.rust]` here
# instead would *replace* the inherited table, losing clippy::pedantic,
# clippy::nursery and clippy::unwrap_used in the one crate that least wants them
# relaxed.
[lints]
workspace = true
