[workspace]
resolver = "2"
members = [
    "rustconn-core",
    "rustconn",
    "rustconn-cli",
    "rustconn-pty-sys",
    "rustconn-locale-sys",
    "rustconn-env-sys",
    "rustconn-dock-sys",
]

[workspace.package]
version = "0.21.12"
edition = "2024"
authors = ["Anton Isaiev <totoshko88@gmail.com>"]
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
# Async runtime
# Precise feature set (was "full"): the union of what the workspace actually
# uses. Cargo unifies tokio features across all crates, so listing the real
# set here drops unused features (test-util, io-std, signal, parking_lot, …)
# and trims tokio's own compile. Verify with `cargo build` after changing.
tokio = { version = "1.50", features = [
    "rt-multi-thread", # Runtime::new() in GUI/CLI + tokio::spawn workers in core
    "macros",          # tokio::select! in the debounce worker
    "net",             # TcpStream / lookup_host (host & port checks)
    "time",            # tokio::time::timeout across vault ops
    "sync",            # mpsc / watch channels in managers
    "fs",              # async config writes + CLI-download installs
    "process",         # tokio::process::Command (CLI downloads, secret backends)
    "io-util",         # AsyncWriteExt / AsyncReadExt
] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml is deprecated; serde_yaml_ng is a maintained drop-in fork
serde_yaml = { version = "0.10", package = "serde_yaml_ng" }
toml = "1.0"

# GTK4 and VTE
gtk4 = "0.11"
vte4 = "0.10"
# v1_5 is the baseline because Ubuntu 24.04 (libadwaita 1.5.0) and the snap's
# core24 gnome-46-2404 platform are still supported build targets — see the
# `adw-1-6` feature in rustconn/Cargo.toml for the opt-in 1.6+ path.
libadwaita = { version = "0.9", features = ["v1_5"] }

# Utilities
async-channel = "2.5"
uuid = { version = "1.22", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
secrecy = { version = "0.10", features = ["serde"] }
dirs = "6.0"
shellexpand = "3.1"
regex = "1.12"
zeroize = "1.8"

# Encryption
ring = "0.17"
argon2 = "0.6"
hex = "0.4"

# Secret Service (keyring) client used on Linux/BSD only — never compiled on
# macOS (see rustconn-core target table). default-features off drops the
# bundled default crypto/runtime selection; we opt into tokio + native_crypto
# (pure-Rust, no OpenSSL) + tracing explicitly.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto", "tracing"] }

# HTTP client and archive handling (for CLI download in Flatpak)
# native-tls instead of rustls-tls: minimises aws-lc-sys surface.
# Note: sspi (via ironrdp-connector) still pulls aws-lc-sys transitively;
# Flatpak manifests work around the GCC 15 -O2/-O0 conflict with a cc-wrap shim.
reqwest = { version = "0.13", features = ["native-tls", "stream"], default-features = false }
zip = "8.2"
flate2 = "1.1"
tar = "0.4.45"

# TLS — native-tls 0.2.18 fixes the Tlsv13 compile bug from 0.2.17
# See: https://github.com/rust-native-tls/rust-native-tls/issues/367
native-tls = "0.2.18"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unicode text processing
unicode-segmentation = "1.13"

# Internationalization (gettext). Declared here because two crates share it and
# they must resolve to the same version: `LocaleCategory` crosses the boundary
# between them. `setlocale` is `unsafe` as of 0.8 (RUSTSEC-2026-0244) and is
# therefore called only from rustconn-locale-sys; rustconn uses the safe rest.
gettext-rs = { version = "0.8", features = ["gettext-system"] }

# Testing
proptest = "1.10"
tempfile = "3.26"

[workspace.lints.rust]
# `deny`, not `forbid`, and the difference is load-bearing. `forbid` cannot be
# overridden at any level, so the sanctioned FFI crates — rustconn-pty-sys,
# rustconn-locale-sys, rustconn-env-sys, rustconn-dock-sys — could not inherit
# this table at all; each declared its own `[lints.rust] unsafe_code = "allow"`
# instead, and that replaces the inherited set rather than adding to it. The
# result was that the only crates where `unsafe` is allowed were also the only
# ones with no clippy lints whatsoever — not `all`, not `unwrap_used`, not
# `dbg_macro`.
# `deny` lets each of them write `[lints] workspace = true` and re-open just this
# one lint with a crate-level `#![expect(unsafe_code, reason = "…")]`, so they now
# get pedantic and nursery like everything else. Introducing `unsafe` anywhere
# else is still a hard error, and the pre-write hook blocks it before the
# compiler is reached.
unsafe_code = "deny"
# Unsafe-hardening set, IronRDP-derived, added 2026-08-20. These three are off by
# default and sit in no lint group, so nothing was enforcing them. They became
# relevant when the workspace moved from `forbid` to `deny` + a crate-level
# `#![expect(unsafe_code)]` in the four -sys crates: under `forbid` there was no
# sanctioned `unsafe` to check, now there is.
# No `unsafe fn` exists in the workspace today, so the first is a forward guard —
# it makes an `unsafe fn` require its own inner `unsafe` block rather than
# silently treating the whole body as unsafe.
unsafe_op_in_unsafe_fn = "warn"
missing_unsafe_on_extern = "warn"
unsafe_attr_outside_unsafe = "warn"
# Low-risk hygiene lints from rust-pragmatic-guidelines.md. missing_debug_implementations
# is intentionally NOT enabled: on a GTK4 codebase it would fire on hundreds of
# widget-wrapping structs, breaking the 0-warning gate and forcing manual Debug impls
# nobody asked for (YAGNI).
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
# IronRDP-inspired: find pub items invisible outside their module
# NOTE: noisy in test helper code — suppress per-file with
# #![allow(unreachable_pub)] in test entry points if needed.
unreachable_pub = "warn"
# IronRDP-inspired: catch redundant `use` imports
redundant_imports = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# ponytail: const-fn suggestions disabled because Vec/HashMap methods aren't const
# in stable Rust; drop this allow once they stabilise and re-run clippy.
missing_const_for_fn = "allow"
# Documentation backticks are too noisy for widget names
doc_markdown = "allow"
# Numeric casts are common in coordinate/size calculations
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Option::map_or patterns are often clearer with if let
option_if_let_else = "allow"
# must_use on every getter is too verbose
must_use_candidate = "allow"
# Match arms with identical bodies are sometimes clearer than alternatives
match_same_arms = "allow"
# Format string inlining is a style preference
uninlined_format_args = "allow"
# let...else is newer syntax, if let is still valid
manual_let_else = "allow"
# Prefixed bindings are sometimes needed for clarity
no_effect_underscore_binding = "allow"
# cloned vs copied is minor optimization
cloned_instead_of_copied = "allow"
# Option/Result wrapping is sometimes needed for API consistency
unnecessary_wraps = "allow"
# If block deduplication can reduce readability
branches_sharing_code = "allow"
# map().unwrap_or() patterns are common and readable
map_unwrap_or = "allow"
# Manual Option::map is sometimes clearer
manual_map = "allow"
# Clone assignment is sometimes clearer than clone_from
assigning_clones = "allow"

# Pragmatic Rust Guidelines (M-LINT-OVERRIDE-EXPECT): force every #[allow]
# / #[expect] override to carry a `reason = "..."` so future readers
# understand why the lint is suppressed.
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"   # catches .clone() on Rc/Arc — prefer Rc::clone(&x)
redundant_clone = "warn"   # catches .clone() where the value is not used again
empty_drop = "warn"         # flags empty Drop impls (usually a mistake)

# Unsafe-hardening set (clippy side), IronRDP-derived, added 2026-08-20.
# All three live in clippy::restriction, which this workspace does NOT enable, so
# none of them was active. The repo already writes a `// SAFETY:` comment on every
# unsafe block by convention — 9 blocks, 9 comments — but nothing enforced it, and
# convention does not survive a hurried edit. These make it a compile-time rule.
# Deliberately NOT added, having been checked against this codebase:
#   allow_attributes           — 111 `#[allow]` sites across 34 files would all
#                                warn at once; that is a bounded refactor to
#                                `#[expect]`, not a lint flip. See M-LINT-OVERRIDE-EXPECT.
#   unused_crate_dependencies  — duplicates the `cargo machete` CI gate and fires
#                                on `native-tls`, which exists only to pin a version.
#   transmute_ptr_to_ptr, ptr_cast_constness, as_ptr_cast_mut, cast_ptr_alignment,
#   missing_safety_doc         — already covered by pedantic/nursery/default.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
multiple_unsafe_ops_per_block = "warn"

# IronRDP-inspired: catch debug/development leftovers before they reach main
unwrap_used = "warn"        # forces explicit error handling (expect/? instead of unwrap)
dbg_macro = "warn"          # no dbg!() in committed code
todo = "warn"               # no todo!() in releases
print_stdout = "warn"       # use tracing, not println! (library code)
print_stderr = "warn"       # use tracing, not eprintln! (library code)
# IronRDP-inspired: explicit imports for better readability and smaller diffs
wildcard_imports = "warn"
# redundant_pub_crate conflicts with unreachable_pub — when a module is private,
# pub(crate) is technically redundant but communicates intent. Suppress the noise.
redundant_pub_crate = "allow"



# IronRDP-inspired: compile the test-only hot crates with optimizations even in
# debug test builds.
#
# Measured 2026-08-20, `cargo test -p rustconn-core --test property_tests`,
# 1453 tests, same machine, back to back:
#
#   argon2 at opt-level 0 (proptest/rand_chacha only):  192.7s test time
#   argon2 at opt-level 3:                               37.9s test time
#
# 5.1x, for +21s of one-time compile (1m12s -> 1m33s). The dominant cost was
# `bitwarden_password_encrypt_decrypt_roundtrip`, which the harness itself flags
# as "running for over 60 seconds": that is argon2 doing KDF rounds, and argon2
# is a *different* crate that was still building unoptimized. Optimizing proptest
# speeds up the generator, not the code under test — which is why the older claim
# here ("argon2 suite goes from ~120s to ~30s") never matched reality. ~30s is
# roughly right, but only with the entry below.
[profile.test.package.proptest]
opt-level = 3

[profile.test.package.rand_chacha]
opt-level = 3

# The actual hot spot: argon2's KDF rounds in the credential round-trip tests.
[profile.test.package.argon2]
opt-level = 3

# There is deliberately no `[profile.release]` with `strip`.
#
# rpmlint reports `unstripped-binary-or-object` for /usr/bin/rustconn on openSUSE
# because a default Rust release build keeps its symbol table. Silencing it needs
# `strip = "symbols"` — `strip = "debuginfo"` leaves `.symtab` in place and the
# warning with it — and that would take the function names out of every panic
# backtrace. This project is debugged almost entirely from logs users attach to
# issue reports, so a readable backtrace is worth more than a lint warning whose
# badness is zero. Do not "fix" this by adding strip.
