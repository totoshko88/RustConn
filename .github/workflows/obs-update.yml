name: OBS Update (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix, e.g. 0.15.8)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  update-obs:
    name: Update OBS Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      # Deliberately `stable`, unlike ci.yml and release.yml which pin
      # ${{ env.RUST_TOOLCHAIN }} to match rust-toolchain.toml. This job checks
      # out an ARBITRARY released tag, and tags older than 0.20.x carry no
      # rust-toolchain.toml — `stable` is the only value correct for all of them.
      # For newer tags the checked-out toolchain file takes over anyway (cargo
      # here is a rustup proxy), which is the desired result. The cost is not
      # merely an extra toolchain download: scripts/obs-publish.sh vendors
      # `rustc --print sysroot` into rust-toolchain.tar.zst, so whatever this
      # step resolves is the compiler the OBS build uses. For tags >= 0.20.0
      # that is the pinned version; for older tags it is whatever `stable` meant
      # on the day of the re-publish, which is how those tags were always built.
      # Do not add a third copy of the pinned version here: the drift gate in
      # ci.yml only guards the two workflows that build the product.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd osc

      # Shared with release.yml → update-obs. All vendor/toolchain/changelog/osc
      # logic lives in scripts/obs-publish.sh (single source of truth).
      - name: Publish to OBS
        env:
          OBS_USERNAME: ${{ secrets.OBS_USERNAME }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          # Passed via env (not inline interpolation) so the dispatch input
          # can never be interpreted by the shell.
          VERSION: ${{ inputs.version }}
        run: ./scripts/obs-publish.sh "$VERSION"
