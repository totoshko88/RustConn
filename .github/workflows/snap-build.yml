name: Snap Build (reusable)

# Reusable snap build shared by snap.yml (manual, build-only) and release.yml's
# build-snap job (post-release, build + publish + attach). The build steps —
# Install Snapcraft, Build (with the arm64 build-snap retry), Verify runtime
# libraries, Upload artifact — lived twice as near-identical copies and drifted;
# they live here once. Snap store publish and the GitHub-release attach are
# gated by inputs so only the release caller runs them.

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: >-
          Prefix for the uploaded artifact name; the matrix arch is appended as
          "<prefix>-<arch>". snap.yml uses the ref name, release.yml uses
          "snap-package".
        required: true
        type: string
      publish:
        description: >-
          Publish the built snap to the Snap Store and attach it to the GitHub
          release. Only the release caller sets this true; it additionally
          requires the v* tag ref and the SNAP_STORE_TOKEN secret.
        required: false
        default: false
        type: boolean
      release-channel:
        description: Snap Store channel to release the upload into when publish is true.
        required: false
        default: candidate
        type: string
      timeout-minutes:
        description: Per-job timeout. The release caller allows the full ~50-min cargo build.
        required: false
        default: 60
        type: number
    secrets:
      SNAP_STORE_TOKEN:
        description: Snapcraft store credentials; required only when publish is true.
        required: false

# No `permissions` here, at workflow or job level: a called workflow's
# GITHUB_TOKEN comes from the caller's job (release.yml's build-snap grants
# contents: write for the release attach, snap.yml stays read-only), and a
# block here could only downgrade it. The `permissions` key does not evaluate
# expressions, so a conditional `${{ inputs.publish && ... }}` is not an option.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Install Snapcraft
        run: |
          # core26 + the `gnome` extension need Snapcraft >= 9.2 (the release that
          # added core26 support to the extension); stable provides it.
          # See RustConn#174.
          sudo snap install snapcraft --classic
          snapcraft --version

      - name: Build Snap
        id: build
        run: |
          # The `gnome` extension pulls build-snaps (mesa-2604, gnome-core26-sdk)
          # from the store during "Installing build-snaps". On the arm64 runner
          # this intermittently fails with "Error installing snap 'mesa-2604'
          # from channel 'latest/stable'" (transient store/network flakiness),
          # which killed the arm64 revision for v0.17.7. Retry the whole pack a
          # few times: snapcraft is incremental (no `clean`), so a retry only
          # re-runs the failed build-snap install, not the ~50-min cargo build.
          for attempt in 1 2 3; do
            if snapcraft pack --verbose; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::snapcraft pack failed after 3 attempts"; exit 1; }
            echo "::warning::snapcraft pack attempt $attempt failed (often a transient build-snap install error); retrying in 30s"
            sleep 30
          done
          SNAP_FILE=$(ls *.snap)
          echo "snap=$SNAP_FILE" >> $GITHUB_OUTPUT
          echo "Built: $SNAP_FILE"

      - name: Verify runtime libraries resolve
        # A '-dev' entry in build-packages satisfies the linker at build time but
        # ships nothing; without the matching stage-packages entry the snap packs,
        # uploads and installs cleanly and then dies at the dynamic linker before
        # main() (issue #244, shipped in 0.19.0 and unnoticed for six releases).
        # Resolve the packed binaries' DT_NEEDED list against what the snap, the
        # base and the gnome platform actually provide at runtime. On the release
        # caller this also gates the store publish below.
        run: |
          command -v unsquashfs > /dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends squashfs-tools
          }
          sudo snap install core26 gnome-core26 mesa-2604
          ./scripts/check-snap-runtime-libs.sh "${{ steps.build.outputs.snap }}"

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to Snap Store
        if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}
        # Channel layout since snapcraft.io Builds (Launchpad) was enabled:
        #   edge      — rolling builds from main, auto-published by the
        #               snapcraft.io build service (do NOT upload here: two
        #               publishers racing for edge produce confusing history)
        #   candidate — tagged release builds from this workflow (exact
        #               released code, CI provenance)
        #   stable    — manual promote of a tested candidate revision;
        #               "Update metadata on release" then syncs the store
        #               listing from that revision's snapcraft.yaml
        timeout-minutes: 10
        run: snapcraft upload ${{ steps.build.outputs.snap }} --release ${{ inputs.release-channel }}

      - name: Attach snap to the GitHub release
        if: ${{ inputs.publish }}
        # Best-effort: the release already exists (the calling job needs it). A
        # failure here does not affect the store publish above or the release.
        continue-on-error: true
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ steps.build.outputs.snap }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
