name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Must equal `channel` in rust-toolchain.toml and the same variable in ci.yml —
  # the CI `hygiene` job fails the build if any of the three drift apart. Without
  # this, a job asking for `stable` installs stable and then has the toolchain
  # file pull a second toolchain on the first cargo call.
  #
  # The `build-rpm` job deliberately opts out via RUSTUP_TOOLCHAIN=1.95.0: its
  # RPM is built on MSRV.
  RUST_TOOLCHAIN: '1.97.1'

# Least privilege by default; jobs that need more (e.g. creating the GitHub
# release) raise it explicitly at the job level.
permissions:
  contents: read

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            debhelper \
            devscripts \
            dpkg-dev \
            gettext

      - name: Build release binary
        run: cargo build --release -p rustconn -p rustconn-cli --features full

      - name: Create deb package structure
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PKG_DIR="rustconn_${VERSION}_amd64"
          
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/metainfo"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "${PKG_DIR}/usr/share/doc/rustconn"
          
          # Binaries
          cp target/release/rustconn "${PKG_DIR}/usr/bin/"
          cp target/release/rustconn-cli "${PKG_DIR}/usr/bin/"
          
          # Desktop file and metadata
          cp rustconn/assets/io.github.totoshko88.RustConn.desktop "${PKG_DIR}/usr/share/applications/"
          cp rustconn/assets/io.github.totoshko88.RustConn.metainfo.xml "${PKG_DIR}/usr/share/metainfo/"
          
          # Icons
          cp rustconn/assets/icons/hicolor/scalable/apps/io.github.totoshko88.RustConn.svg \
             "${PKG_DIR}/usr/share/icons/hicolor/scalable/apps/" || true
          for size in 256 128; do
            cp "rustconn/assets/icons/hicolor/${size}x${size}/apps/io.github.totoshko88.RustConn.png" \
               "${PKG_DIR}/usr/share/icons/hicolor/${size}x${size}/apps/" 2>/dev/null || true
          done
          
          # Docs and copyright
          cp README.md LICENSE CHANGELOG.md "${PKG_DIR}/usr/share/doc/rustconn/"
          cp debian/copyright "${PKG_DIR}/usr/share/doc/rustconn/copyright"
          
          # Locale files (compile .po to .mo)
          for po_file in po/*.po; do
            [ -f "$po_file" ] || continue
            lang=$(basename "$po_file" .po)
            mkdir -p "${PKG_DIR}/usr/share/locale/${lang}/LC_MESSAGES"
            msgfmt -o "${PKG_DIR}/usr/share/locale/${lang}/LC_MESSAGES/rustconn.mo" "$po_file"
          done
          
          # Derive the library dependencies from the binaries instead of listing
          # them by hand (issue #313, reported by @philclifford).
          #
          # This package is assembled here and packed with `dpkg-deb --build`, so
          # nothing runs the machinery a normal Debian build would: every runtime
          # library had to be named in the line below, and the list fell behind the
          # binary. `web-embedded` is in the crate's `default` features, so the
          # binary links libwebkitgtk-6.0.so.4 and libjavascriptcoregtk-6.0.so.1,
          # and neither was declared — the package installed and then died in the
          # dynamic linker before main(). Checked against the recursive closure of
          # the old list (266 packages): libasound2t64 was missing too, from the
          # RDP audio feature, and had simply not bitten anyone yet because ALSA is
          # usually already installed.
          #
          # `dpkg-shlibdeps` reads the ELF headers of the staged binaries, maps each
          # soname to the package that ships it, and derives a minimum version from
          # the symbols actually referenced. It must run from the source root, since
          # it reads debian/control — and that file earns its keep here: a version in
          # its Build-Depends raises the derived floor, so `libgtk-4-dev (>= 4.14)`
          # produces `libgtk-4-1 (>= 4.14)` where the symbols alone would only prove
          # 4.12. Verified locally both ways.
          #
          # Two things it cannot know, so they stay declared by hand: openssh-client
          # is a program rather than a library, and Recommends are optional helpers
          # nothing links against. The Recommends list is copied from debian/control,
          # which had five entries where this one had three — the released package
          # was not recommending picocom, the helper serial connections need.
          SHLIB_DEPS="$(dpkg-shlibdeps -O \
              "${PKG_DIR}/usr/bin/rustconn" \
              "${PKG_DIR}/usr/bin/rustconn-cli" \
              | sed 's/^shlibs:Depends=//')"
          if [ -z "${SHLIB_DEPS}" ]; then
            echo "::error::dpkg-shlibdeps produced no dependencies — refusing to ship a package that declares none"
            exit 1
          fi
          case "${SHLIB_DEPS}" in
            *libwebkitgtk*) ;;
            *) echo "::error::libwebkitgtk missing from derived dependencies; issue #313 would recur"; exit 1 ;;
          esac
          echo "Derived Depends: ${SHLIB_DEPS}"

          # Control file
          cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: rustconn
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: ${SHLIB_DEPS}, openssh-client
          Recommends: freerdp2-x11 | freerdp3-x11 | freerdp3-wayland, tigervnc-viewer, virt-viewer, picocom, libopenh264-8 | libopenh264-7
          Maintainer: Anton Isaiev <totoshko88@gmail.com>
          Homepage: https://github.com/totoshko88/RustConn
          Description: Modern connection manager for Linux
           RustConn is a GTK4-based connection manager for SSH, RDP, VNC, and SPICE
           remote connections with support for embedded terminals, connection groups,
           import/export, and secure credential storage.
          EOF
          
          # Build deb
          dpkg-deb --build "${PKG_DIR}"
          mkdir -p dist
          mv "${PKG_DIR}.deb" dist/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/*.deb

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    # This job installs rustup with --default-toolchain 1.95.0 on purpose (MSRV),
    # and the cargo it then calls is a rustup proxy, so it WOULD read the repo's
    # rust-toolchain.toml and silently build the shipped RPM with 1.97.1 instead.
    # RUSTUP_TOOLCHAIN outranks that file. Keep in sync with the
    # --default-toolchain value in the "Install Rust" step below.
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - name: Install build tools
        run: |
          dnf install -y \
            git \
            curl \
            gcc \
            make \
            pkg-config \
            gtk4-devel \
            vte291-gtk4-devel \
            libadwaita-devel \
            webkitgtk6.0-devel \
            dbus-devel \
            openssl-devel \
            alsa-lib-devel \
            rpm-build \
            ruby-devel \
            rubygems \
            zstd \
            gettext

      - name: Install fpm
        run: gem install fpm

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0 --profile minimal
          source $HOME/.cargo/env
          cargo --version
          # Assert rather than just echo. If the job-level RUSTUP_TOOLCHAIN ever
          # goes missing, rust-toolchain.toml silently wins and the shipped RPM
          # is built with the development toolchain while this log still looks
          # healthy — the exact regression this env var exists to prevent. The
          # `msrv` job in ci.yml carries the same assertion.
          actual="$(rustc --version)"
          echo "rustc in effect: $actual"
          case "$actual" in
            *" 1.95."*) ;;
            *) echo "::error::RPM must be built on MSRV 1.95 (got: $actual)"; exit 1 ;;
          esac

      - name: Build release binary
        run: |
          source $HOME/.cargo/env
          # This container is Fedora 44, which carries GTK 4.20+ and libadwaita
          # 1.9 — but the build passed no version feature at all, so the RPM on
          # every GitHub release shipped the libadwaita 1.5 baseline and could
          # not reach the Command monitoring mode. Detect instead of assuming: a
          # Fedora release number is not a library version, and the container
          # image moves without this file changing.
          #
          # Same ladders as packaging/obs/rustconn.spec, and `--atleast-version`
          # for the same reason — a glob over `--modversion` misses libadwaita
          # 1.10. Names are package-qualified because two -p packages are
          # selected here and `full` belongs to rustconn-cli.
          #
          # Fails safe: if a pkg-config file is missing the ladder yields
          # nothing and the build is exactly what it was before.
          FEATURES="full"
          if pkg-config --atleast-version=1.8 libadwaita-1 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/adw-1-8"
          elif pkg-config --atleast-version=1.7 libadwaita-1 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/adw-1-7"
          elif pkg-config --atleast-version=1.6 libadwaita-1 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/adw-1-6"
          fi
          if pkg-config --atleast-version=4.22 gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/gtk-4-22"
          elif pkg-config --atleast-version=4.20 gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/gtk-4-20"
          elif pkg-config --atleast-version=4.18 gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/gtk-4-18"
          fi
          if pkg-config --atleast-version=0.78 vte-2.91-gtk4 2>/dev/null; then
            FEATURES="$FEATURES,rustconn/vte-0-78"
          fi
          echo "=== gtk4 $(pkg-config --modversion gtk4 2>/dev/null)" \
               "| libadwaita $(pkg-config --modversion libadwaita-1 2>/dev/null)" \
               "| vte $(pkg-config --modversion vte-2.91-gtk4 2>/dev/null)" \
               "=> --features $FEATURES ==="
          cargo build --release -p rustconn -p rustconn-cli --features "$FEATURES"

      - name: Create RPM package
        run: |
          source $HOME/.cargo/env
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          
          # Create staging directory
          mkdir -p staging/usr/bin
          mkdir -p staging/usr/share/applications
          mkdir -p staging/usr/share/metainfo
          mkdir -p staging/usr/share/icons/hicolor/scalable/apps
          mkdir -p staging/usr/share/icons/hicolor/128x128/apps
          mkdir -p staging/usr/share/icons/hicolor/256x256/apps
          
          # Copy binaries
          cp target/release/rustconn staging/usr/bin/
          cp target/release/rustconn-cli staging/usr/bin/
          
          # Copy desktop file and metadata
          cp rustconn/assets/io.github.totoshko88.RustConn.desktop staging/usr/share/applications/
          cp rustconn/assets/io.github.totoshko88.RustConn.metainfo.xml staging/usr/share/metainfo/
          
          # Copy icons
          cp rustconn/assets/icons/hicolor/scalable/apps/io.github.totoshko88.RustConn.svg \
             staging/usr/share/icons/hicolor/scalable/apps/ 2>/dev/null || true
          for size in 128 256; do
            cp "rustconn/assets/icons/hicolor/${size}x${size}/apps/io.github.totoshko88.RustConn.png" \
               "staging/usr/share/icons/hicolor/${size}x${size}/apps/" 2>/dev/null || true
          done
          
          # Locale files (compile .po to .mo)
          for po_file in po/*.po; do
            [ -f "$po_file" ] || continue
            lang=$(basename "$po_file" .po)
            mkdir -p "staging/usr/share/locale/${lang}/LC_MESSAGES"
            msgfmt -o "staging/usr/share/locale/${lang}/LC_MESSAGES/rustconn.mo" "$po_file"
          done
          
          # Build RPM with fpm
          fpm -s dir -t rpm \
            -n rustconn \
            -v "${VERSION}" \
            --iteration 1 \
            --license "GPL-3.0-or-later" \
            --vendor "Anton Isaiev" \
            --maintainer "Anton Isaiev <totoshko88@gmail.com>" \
            --url "https://github.com/totoshko88/RustConn" \
            --description "Modern connection manager for Linux (SSH, RDP, VNC, SPICE)" \
            --rpm-autoreqprov \
            --depends "gtk4 >= 4.14" \
            --depends "libadwaita" \
            --depends "vte291-gtk4" \
            --depends "openssh-clients" \
            -C staging \
            usr
          
          # Move to dist
          mkdir -p dist
          mv *.rpm dist/
          
          echo "=== Built RPM packages ==="
          ls -la dist/
          
          # The .deb's defect (issue #313) in the other packaging tool. fpm writes
          # `AutoReqProv: no` unless told otherwise, so rpmbuild's dependency
          # generator never ran and the four --depends above were the whole of
          # Requires: the published 0.21.4 RPM carried zero soname requires and so
          # never named libwebkitgtk-6.0.so.4 or libasound.so.2, both of which the
          # binary links. `--rpm-autoreqprov` turns the generator back on.
          #
          # The explicit --depends stay: a soname cannot express "gtk4 at least
          # 4.14", the floor the v4_14 bindings assert but no referenced symbol
          # proves, and openssh-clients is a program rather than a library.
          echo "=== Requires ==="
          rpm -qp --requires dist/*.rpm | sort
          if ! rpm -qp --requires dist/*.rpm | grep -q 'libwebkitgtk'; then
            echo "::error::libwebkitgtk absent from RPM Requires — issue #313 would recur"
            exit 1
          fi

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: dist/*.rpm

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libfuse2 \
            gettext

      - name: Build release
        run: cargo build --release -p rustconn -p rustconn-cli --features full

      - name: Download linuxdeploy
        run: |
          # linuxdeploy ships only a "continuous" tag whose artifacts are
          # rebuilt (checksums are not stable) — retry + ELF sanity check.
          # The GTK plugin is a plain script: pin commit + checksum.
          wget -q --tries=5 --waitretry=10 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          file linuxdeploy-x86_64.AppImage | grep -q 'ELF 64-bit' || { echo "::error::linuxdeploy download is not an ELF binary"; exit 1; }
          GTK_PLUGIN_COMMIT=3b67a1d1c1b0c8268f57f2bce40fe2d33d409cea
          GTK_PLUGIN_SHA256=b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171
          wget -q "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${GTK_PLUGIN_COMMIT}/linuxdeploy-plugin-gtk.sh"
          echo "${GTK_PLUGIN_SHA256}  linuxdeploy-plugin-gtk.sh" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/metainfo
          
          cp target/release/rustconn AppDir/usr/bin/
          cp target/release/rustconn-cli AppDir/usr/bin/
          cp rustconn/assets/io.github.totoshko88.RustConn.desktop AppDir/usr/share/applications/
          cp rustconn/assets/io.github.totoshko88.RustConn.metainfo.xml AppDir/usr/share/metainfo/
          
          # Copy icons
          cp rustconn/assets/icons/hicolor/scalable/apps/io.github.totoshko88.RustConn.svg \
             AppDir/usr/share/icons/hicolor/scalable/apps/ || true
          for size in 256 128; do
            cp "rustconn/assets/icons/hicolor/${size}x${size}/apps/io.github.totoshko88.RustConn.png" \
               "AppDir/usr/share/icons/hicolor/${size}x${size}/apps/" 2>/dev/null || true
          done
          
          # Locale files (compile .po to .mo)
          for po_file in po/*.po; do
            [ -f "$po_file" ] || continue
            lang=$(basename "$po_file" .po)
            mkdir -p "AppDir/usr/share/locale/${lang}/LC_MESSAGES"
            msgfmt -o "AppDir/usr/share/locale/${lang}/LC_MESSAGES/rustconn.mo" "$po_file"
          done

      - name: Build AppImage
        run: |
          DEPLOY_GTK_VERSION=4 ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --output appimage
          
          # Rename to include version
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mv RustConn*.AppImage "RustConn-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: "*.AppImage"

  build-snap:
    name: Build & Publish Snap Package
    # Post-release job (like update-obs / update-homebrew): snapcraft + LXD are
    # slow and occasionally flaky, so we must NOT gate the GitHub release on it.
    # The release is created first; the snap is then built, published to the
    # store, and attached to the existing release. A snap failure no longer
    # blocks the release.
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Install Snapcraft
        run: |
          # core24 + the `gnome` extension are fully supported by stable Snapcraft.
          # (Moved off core26: the gnome extension required for GTK4 does not
          # support core26 yet — see snapcraft#6185 and RustConn#174.)
          sudo snap install snapcraft --classic
          snapcraft --version

      - name: Build Snap
        id: build
        run: |
          # The `gnome` extension pulls build-snaps (mesa-2404, gnome-46-2404-sdk)
          # from the store during "Installing build-snaps". On the arm64 runner
          # this intermittently fails with "Error installing snap 'mesa-2404'
          # from channel 'latest/stable'" (transient store/network flakiness),
          # which killed the arm64 revision for v0.17.7. Retry the whole pack a
          # few times: snapcraft is incremental (no `clean`), so a retry only
          # re-runs the failed build-snap install, not the ~50-min cargo build.
          for attempt in 1 2 3; do
            if snapcraft pack --verbose; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::snapcraft pack failed after 3 attempts"; exit 1; }
            echo "::warning::snapcraft pack attempt $attempt failed (often a transient build-snap install error); retrying in 30s"
            sleep 30
          done
          SNAP_FILE=$(ls *.snap)
          echo "snap=$SNAP_FILE" >> $GITHUB_OUTPUT
          echo "Built: $SNAP_FILE"

      - name: Verify runtime libraries resolve
        # Gate the store publish below: a '-dev' entry in build-packages satisfies
        # the linker at build time but ships nothing, so without the matching
        # stage-packages entry the snap packs, uploads and installs cleanly and
        # then dies at the dynamic linker before main() (issue #244, shipped in
        # 0.19.0 and unnoticed for six releases). Resolve the packed binaries'
        # DT_NEEDED list against what the snap, the base and the gnome platform
        # actually provide at runtime.
        run: |
          command -v unsquashfs > /dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends squashfs-tools
          }
          sudo snap install core24 gnome-46-2404 mesa-2404
          ./scripts/check-snap-runtime-libs.sh "${{ steps.build.outputs.snap }}"

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: snap-package-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to Snap Store
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_TOKEN }}
        # Channel layout since snapcraft.io Builds (Launchpad) was enabled:
        #   edge      — rolling builds from main, auto-published by the
        #               snapcraft.io build service (do NOT upload here: two
        #               publishers racing for edge produce confusing history)
        #   candidate — tagged release builds from this workflow (exact
        #               released code, CI provenance)
        #   stable    — manual promote of a tested candidate revision;
        #               "Update metadata on release" then syncs the store
        #               listing from that revision's snapcraft.yaml
        timeout-minutes: 10
        run: snapcraft upload ${{ steps.build.outputs.snap }} --release candidate

      - name: Attach snap to the GitHub release
        # Best-effort: the release already exists (this job needs it). A failure
        # here does not affect the store publish above or the release itself.
        continue-on-error: true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.build.outputs.snap }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install flatpak-cargo-generator
        run: |
          pip install aiohttp toml tomlkit

      - name: Generate cargo sources
        run: |
          # Pinned commit + checksum: this script shapes which sources end
          # up in the Flatpak build (supply-chain hygiene)
          FBT_COMMIT=737c0085912f9f7dabf9341d4608e2a77a51a73a
          FBT_SHA256=b373c8ab1a05378ec5d8ed0645c7b127bcec7d2f7a1798694fbc627d570d856c
          wget -q "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${FBT_COMMIT}/cargo/flatpak-cargo-generator.py"
          echo "${FBT_SHA256}  flatpak-cargo-generator.py" | sha256sum -c -
          chmod +x flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
          cp packaging/flatpak/cargo-sources.json packaging/flathub/cargo-sources.json

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.totoshko88.RustConn.yml
          bundle: RustConn.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          build-bundle: true

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: RustConn.flatpak

  release:
    name: Create Release
    needs: [build-deb, build-rpm, build-appimage, build-flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      # Required by actions/attest-build-provenance: id-token to obtain the
      # Sigstore OIDC token that proves which workflow ran, attestations to
      # store the signed statement against the repository.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download deb artifact
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: dist/

      - name: Download RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: rpm-package
          path: dist/

      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: appimage
          path: dist/

      - name: Download Flatpak artifact
        uses: actions/download-artifact@v8
        with:
          name: flatpak
          path: dist/

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Rename Flatpak with version
        run: mv dist/RustConn.flatpak "dist/RustConn-${{ steps.version.outputs.VERSION }}.flatpak"

      # Signed SLSA build provenance for every file that ends up on the release.
      # Placed after the Flatpak rename on purpose: the attestation binds to a
      # file's digest AND name, so attesting before the rename would leave the
      # published artifact unverifiable.
      #
      # Verify a download with:
      #   gh attestation verify RustConn-<ver>.AppImage --repo totoshko88/RustConn
      #
      # Covers deb, rpm, AppImage and Flatpak. The snap is NOT covered here — it
      # is built in a separate post-release job and the Snap Store does its own
      # signing, so adding it would mean a second attestation step in that job.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract changelog section for this version
          # Start capturing after finding ## [VERSION], stop at next ## [
          awk -v ver="${VERSION}" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found && !/^$/ { print }
            found && /^$/ { print }
          ' CHANGELOG.md > version_changelog.md
          
          # Debug: show what was extracted
          echo "=== Extracted changelog for ${VERSION} ==="
          cat version_changelog.md
          echo "=== End changelog ==="
          
          # If no changelog found, use default message
          if [ ! -s version_changelog.md ]; then
            echo "Release ${VERSION}" > version_changelog.md
          fi

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cat << 'HEADER' > release_notes.md
          ## What's Changed
          
          HEADER
          
          cat version_changelog.md >> release_notes.md
          
          cat << EOF >> release_notes.md
          
          ## Installation

          ### Flatpak (Recommended)
          \`\`\`bash
          flatpak install flathub io.github.totoshko88.RustConn
          \`\`\`

          ### Snap
          \`\`\`bash
          sudo snap install rustconn
          \`\`\`

          ### Debian/Ubuntu (.deb from this release)
          \`\`\`bash
          sudo dpkg -i rustconn_${VERSION}_amd64.deb
          sudo apt-get install -f  # Install dependencies if needed
          \`\`\`

          ### Fedora (.rpm from this release)
          \`\`\`bash
          sudo dnf install rustconn-${VERSION}-1.fc44.x86_64.rpm
          \`\`\`

          ### AppImage
          \`\`\`bash
          chmod +x RustConn-${VERSION}-x86_64.AppImage
          ./RustConn-${VERSION}-x86_64.AppImage
          \`\`\`

          ### macOS (Homebrew)
          \`\`\`bash
          brew tap totoshko88/rustconn
          brew install rustconn
          open \$(brew --prefix)/opt/rustconn/RustConn.app
          \`\`\`
          All dependencies (GTK4, libadwaita, VTE, Adwaita icons) are installed automatically.
          Requires macOS 13 (Ventura) or later.

          ### OBS Repositories
          Packages available at: https://build.opensuse.org/package/show/home:totoshko88:rustconn/rustconn

          \`\`\`bash
          # Debian 13 (Trixie)
          echo 'deb http://download.opensuse.org/repositories/home:/totoshko88:/rustconn/Debian_13/ /' \\
            | sudo tee /etc/apt/sources.list.d/rustconn.list
          curl -fsSL https://download.opensuse.org/repositories/home:/totoshko88:/rustconn/Debian_13/Release.key \\
            | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/rustconn.gpg > /dev/null
          sudo apt update && sudo apt install rustconn

          # Ubuntu 24.04 LTS (Noble)
          echo 'deb http://download.opensuse.org/repositories/home:/totoshko88:/rustconn/xUbuntu_24.04/ /' \\
            | sudo tee /etc/apt/sources.list.d/rustconn.list
          curl -fsSL https://download.opensuse.org/repositories/home:/totoshko88:/rustconn/xUbuntu_24.04/Release.key \\
            | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/rustconn.gpg > /dev/null
          sudo apt update && sudo apt install rustconn

          # Ubuntu 26.04 LTS (Resolute)
          echo 'deb http://download.opensuse.org/repositories/home:/totoshko88:/rustconn/xUbuntu_26.04/ /' \\
            | sudo tee /etc/apt/sources.list.d/rustconn.list
          curl -fsSL https://download.opensuse.org/repositories/home:/totoshko88:/rustconn/xUbuntu_26.04/Release.key \\
            | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/rustconn.gpg > /dev/null
          sudo apt update && sudo apt install rustconn

          # Fedora 44
          sudo dnf config-manager addrepo --from-repofile=https://download.opensuse.org/repositories/home:/totoshko88:/rustconn/Fedora_44/home:totoshko88:rustconn.repo
          sudo dnf install rustconn

          # Fedora 43
          sudo dnf config-manager addrepo --from-repofile=https://download.opensuse.org/repositories/home:/totoshko88:/rustconn/Fedora_43/home:totoshko88:rustconn.repo
          sudo dnf install rustconn

          # openSUSE Tumbleweed
          sudo zypper ar https://download.opensuse.org/repositories/home:/totoshko88:/rustconn/openSUSE_Tumbleweed/ rustconn
          sudo zypper ref && sudo zypper in rustconn

          # openSUSE Leap 16.0
          sudo zypper ar https://download.opensuse.org/repositories/home:/totoshko88:/rustconn/openSUSE_Leap_16.0/ rustconn
          sudo zypper ref && sudo zypper in rustconn
          \`\`\`

          ### Arch Linux (AUR)
          \`\`\`bash
          yay -S rustconn
          \`\`\`

          ### FreeBSD (Ports)
          \`\`\`bash
          pkg install rustconn
          \`\`\`

          Full installation guide: https://github.com/totoshko88/RustConn/blob/main/docs/INSTALL.md
          EOF

      - name: List artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-obs:
    name: Update OBS Package
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd osc

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish to OBS
        env:
          OBS_USERNAME: ${{ secrets.OBS_USERNAME }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: ./scripts/obs-publish.sh "${{ steps.version.outputs.VERSION }}"

  update-homebrew:
    name: Update Homebrew Tap
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout RustConn
        uses: actions/checkout@v7

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download source tarball and compute SHA256
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          URL="https://github.com/totoshko88/RustConn/archive/refs/tags/v${VERSION}.tar.gz"
          # Retry: the tag tarball may not be replicated to all CDN nodes
          # in the first seconds after the release is created
          curl --retry 5 --retry-delay 10 --retry-all-errors -sL "$URL" -o source.tar.gz
          tar -tzf source.tar.gz > /dev/null || { echo "::error::Downloaded tarball is corrupt"; exit 1; }
          SHA256=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "SHA256=${SHA256}" >> $GITHUB_OUTPUT
          echo "Source tarball SHA256: ${SHA256}"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: totoshko88/homebrew-rustconn
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SHA256=${{ steps.sha.outputs.SHA256 }}
          FORMULA="homebrew-tap/Formula/rustconn.rb"

          # Copy the canonical formula from the release source tree.
          # This ensures feature flags, dependencies, and install logic stay in
          # sync with the code — the CI only needs to patch version + sha256.
          cp packaging/macos/rustconn.rb "$FORMULA"

          # Replace the archive URL version (anchored to active `url` line)
          sed -i 's|^\(  url "https://github.com/totoshko88/RustConn/archive/refs/tags/v\)[^"]*\(\.tar\.gz"\)|\1'"${VERSION}"'\2|' "$FORMULA"

          # Replace sha256 (handles both PLACEHOLDER_SHA256 and any previous real hash)
          sed -i 's|^\(  sha256 "\)[^"]*\(".*\)|\1'"${SHA256}"'\2|' "$FORMULA"

          # ── Verification: fail unless exactly one active URL contains the
          # release tag and exactly one active sha256 contains the computed hash.
          # Escape the dots in the version so 0.19.11 cannot match 0X19Y11
          VERSION_RE=${VERSION//./\\.}
          URL_COUNT=$(grep -c "^  url.*v${VERSION_RE}\.tar\.gz" "$FORMULA" || true)
          SHA_COUNT=$(grep -c "^  sha256 \"${SHA256}\"" "$FORMULA" || true)

          if [[ "$URL_COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly 1 active URL with v${VERSION}, found ${URL_COUNT}"
            head -15 "$FORMULA"
            exit 1
          fi
          if [[ "$SHA_COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly 1 active sha256 with computed hash, found ${SHA_COUNT}"
            head -15 "$FORMULA"
            exit 1
          fi

          echo "=== Updated formula (first 10 lines) ==="
          head -10 "$FORMULA"

      - name: Commit and push
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rustconn.rb
          # Idempotent: a re-run for the same version produces identical content,
          # so skip the commit/push when nothing changed (avoids a failed
          # "nothing to commit" exit on retry).
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION} — nothing to commit"
          else
            git commit -m "rustconn ${VERSION}

          Automated update from RustConn release v${VERSION}
          https://github.com/totoshko88/RustConn/releases/tag/v${VERSION}"
            git push
          fi
