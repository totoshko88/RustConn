name: Snap Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Build-only: the shared workflow's publish/attach steps stay off (publish
    # defaults to false), so a manual run never touches the Snap Store or a
    # GitHub release. Artifacts are named snap-<ref>-<arch>.
    uses: ./.github/workflows/snap-build.yml
    with:
      artifact-prefix: snap-${{ github.ref_name }}
